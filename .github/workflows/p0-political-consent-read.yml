name: P0 political consent read isolation — main extraction
on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/routes/compatibility.js'
      - 'api/routes/users/profile.js'
      - 'api/services/politicalMatchingService.js'
      - 'api/tests/politicalMatchingService.test.js'
      - 'api/tests/politicalConsentMainRead.synthetic.test.js'
      - 'api/tests/politicalConsentMainRead.pg.integration.test.js'
      - '.github/workflows/p0-political-consent-read.yml'
permissions:
  contents: read

jobs:
  route-and-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check changed production JavaScript syntax
        run: |
          node --check api/routes/compatibility.js
          node --check api/routes/users/profile.js
          node --check api/services/politicalMatchingService.js
      - name: Real route bodies with synthetic JWT/SQL and matching regression
        run: node --test api/tests/politicalConsentMainRead.synthetic.test.js api/tests/politicalMatchingService.test.js

  disposable-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demos_ci
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: demos_political_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demos_ci -d demos_political_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test library
        run: npm install --prefix /tmp/demos-political-ci --no-save --ignore-scripts --no-audit --no-fund pg@8.11.3
      - name: Test current matching service on ephemeral PostgreSQL17
        env:
          NODE_PATH: /tmp/demos-political-ci/node_modules
          CIVIC_TEST_DATABASE_URL: postgres://demos_ci:synthetic_only@127.0.0.1:5432/demos_political_ci
          CIVIC_TEST_MODE: isolated-synthetic
        run: node --test api/tests/politicalConsentMainRead.pg.integration.test.js
