name: Chrono mobilizations adapter regression

on:
  pull_request:
    paths:
      - 'api/services/chronocolEventFeedService.js'
      - 'api/routes/eventi.js'
      - 'api/tests/chronocolEventFeedService.test.js'
      - 'client/src/pages/Eventi.tsx'
      - '.github/workflows/chronocol-eventi.yml'
  push:
    branches: [main]
    paths:
      - 'api/services/chronocolEventFeedService.js'
      - 'api/routes/eventi.js'
      - 'api/tests/chronocolEventFeedService.test.js'
      - 'client/src/pages/Eventi.tsx'

jobs:
  chrono-eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Probe Chrono public pages for source integration (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          const base = 'https://mobilitazioni.chronocol.com/';
          (async () => {
            for (const path of ['', 'policy', 'statistiche']) {
              try {
                const response = await fetch(new URL(path, base), {
                  signal: AbortSignal.timeout(10000),
                  headers: { 'User-Agent': 'DemosApp-Integration-Research/1.0' }
                });
                const html = (await response.text()).slice(0, 150000);
                const hrefs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
                  .map((x) => x[1])
                  .filter((x) => ['.js', '.json', 'api', 'download', 'export', 'csv'].some((piece) => x.includes(piece)))
                  .slice(0, 40);
                const hints = [...new Set(html.split('"/api/').slice(1)
                  .map((fragment) => '/api/' + fragment.split('"')[0]))].slice(0, 30);
                const plain = html.replace(/<[^>]+>/g, ' ').slice(0, 1800);
                console.log(JSON.stringify({ path, status: response.status, finalUrl: response.url,
                  contentType: response.headers.get('content-type'), bytes: html.length,
                  links: hrefs, apiHints: hints, sampleText: plain }));
              } catch (error) {
                console.log(JSON.stringify({ path, error: error.message }));
              }
            }
            try {
              const response = await fetch(new URL('/static/js/main.a1d868f8.js', base), {
                signal: AbortSignal.timeout(15000)
              });
              const js = await response.text();
              const apiPaths = [...new Set(js.match(new RegExp('/api/[A-Za-z0-9_/?=&.:-]+', 'g')) || [])].slice(0, 100);
              const excerpts = {};
              for (const keyword of ['mobilitazioni', 'events', 'download', 'export', 'csv', 'licenza', 'dati aperti', 'api/', 'policy']) {
                const haystack = js.toLowerCase();
                const hits = [];
                let offset = 0;
                for (let i = 0; i < 6; i++) {
                  const hit = haystack.indexOf(keyword, offset);
                  if (hit < 0) break;
                  hits.push(js.slice(Math.max(0, hit - 100), Math.min(js.length, hit + 180)));
                  offset = hit + keyword.length;
                }
                excerpts[keyword] = hits;
              }
              console.log(JSON.stringify({ asset: 'main-js', status: response.status,
                contentType: response.headers.get('content-type'), bytes: js.length,
                apiPaths, excerpts }));
            } catch (error) {
              console.log(JSON.stringify({ asset: 'main-js', error: error.message }));
            }
          })();
          NODE
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Run Chrono and existing Eventi feed tests
        run: node --test api/tests/chronocolEventFeedService.test.js api/tests/eventFeedService.test.js
      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build --prefix client
