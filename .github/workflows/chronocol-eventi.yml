name: Chrono mobilizations adapter regression

on:
  pull_request:
    paths:
      - 'api/services/chronocolEventFeedService.js'
      - 'api/routes/eventi.js'
      - 'api/tests/chronocolEventFeedService.test.js'
      - 'client/src/pages/Eventi.tsx'
      - '.github/workflows/chronocol-eventi.yml'
  push:
    branches: [main]
    paths:
      - 'api/services/chronocolEventFeedService.js'
      - 'api/routes/eventi.js'
      - 'api/tests/chronocolEventFeedService.test.js'
      - 'client/src/pages/Eventi.tsx'

jobs:
  chrono-eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Probe Chrono public pages for source integration (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          const base = 'https://mobilitazioni.chronocol.com/';
          (async () => {
            for (const path of ['', 'policy', 'statistiche']) {
              try {
                const response = await fetch(new URL(path, base), {
                  signal: AbortSignal.timeout(10000),
                  headers: { 'User-Agent': 'DemosApp-Integration-Research/1.0' }
                });
                const html = (await response.text()).slice(0, 150000);
                const hrefs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
                  .map((x) => x[1])
                  .filter((x) => ['.js', '.json', 'api', 'download', 'export', 'csv'].some((piece) => x.includes(piece)))
                  .slice(0, 40);
                const hints = [...new Set(html.split('"/api/').slice(1)
                  .map((fragment) => '/api/' + fragment.split('"')[0]))].slice(0, 30);
                const plain = html.replace(/<[^>]+>/g, ' ').slice(0, 1800);
                console.log(JSON.stringify({ path, status: response.status, finalUrl: response.url,
                  contentType: response.headers.get('content-type'), bytes: html.length,
                  links: hrefs, apiHints: hints, sampleText: plain }));
              } catch (error) {
                console.log(JSON.stringify({ path, error: error.message }));
              }
            }
            try {
              const response = await fetch(new URL('/static/js/main.a1d868f8.js', base), {
                signal: AbortSignal.timeout(15000)
              });
              const js = await response.text();
              const apiPaths = [...new Set(js.match(new RegExp('/api/[A-Za-z0-9_/?=&.:-]+', 'g')) || [])].slice(0, 100);
              const excerpts = {};
              for (const keyword of ['mobilitazioni', 'events', 'download', 'export', 'csv', 'licenza', 'dati aperti', 'api/', 'policy']) {
                const haystack = js.toLowerCase();
                const hits = [];
                let offset = 0;
                for (let i = 0; i < 6; i++) {
                  const hit = haystack.indexOf(keyword, offset);
                  if (hit < 0) break;
                  hits.push(js.slice(Math.max(0, hit - 100), Math.min(js.length, hit + 180)));
                  offset = hit + keyword.length;
                }
                excerpts[keyword] = hits;
              }
              const focused = {};
              for (const keyword of ['text/csv', '.csv', 'w-mobs', 'w-mob-nazionales', '/api/w-mobs',
                'scarica il csv', 'free to use', 'fetchmobilitazioni', 'statistics']) {
                const low = js.toLowerCase();
                const hits = [];
                let offset = 0;
                for (let i = 0; i < 7; i++) {
                  const hit = low.indexOf(keyword, offset);
                  if (hit < 0) break;
                  hits.push(js.slice(Math.max(0, hit - 220), Math.min(js.length, hit + 330)));
                  offset = hit + keyword.length;
                }
                focused[keyword] = hits;
              }
              console.log(JSON.stringify({ asset: 'main-js', status: response.status,
                contentType: response.headers.get('content-type'), bytes: js.length,
                apiPaths, focused }));
            } catch (error) {
              console.log(JSON.stringify({ asset: 'main-js', error: error.message }));
            }
            try {
              const fields = ['DESCRIZIONE', 'PIATTAFORMA', 'DATA_ORARIO', 'INDIRIZZO',
                'VERIFICATA', 'CITTA', 'TIPO', 'LATITUDE', 'LONGITUDE', 'DATA_FINE',
                'FUSO_ORARIO', 'FINE_EFFETTIVA', 'RITROVO_LUOGO', 'RITROVO_ORARIO',
                'SCIOPERO', 'ANNULLATA'];
              const params = new URLSearchParams();
              fields.forEach((field, i) => params.set('fields[' + i + ']', field));
              params.set('pagination[pageSize]', '2');
              params.set('filters[VERIFICATA][$eq]', 'true');
              params.set('filters[ANNULLATA][$eq]', 'false');
              params.set('sort[0]', 'DATA_ORARIO:asc');
              const url = base + 'api/w-mobs?' + params;
              const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const data = await response.json();
              console.log(JSON.stringify({ asset: 'real-projection', status: response.status,
                count: data.data?.length ?? null, total: data.meta?.pagination?.total ?? null,
                keys: data.data?.[0] ? Object.keys(data.data[0]) : [],
                sample: (data.data || []).slice(0, 2).map((item) =>
                  ({ day: item.DATA_ORARIO, end: item.DATA_FINE, city: item.CITTA,
                    type: item.TIPO, verified: item.VERIFICATA, cancelled: item.ANNULLATA,
                    endActual: item.FINE_EFFETTIVA, timezone: item.FUSO_ORARIO,
                    addressType: typeof item.INDIRIZZO, cityType: typeof item.CITTA,
                    routeType: typeof item.PERCORSO,
                    latitudeType: typeof item.LATITUDE,
                    descriptionLength: String(item.DESCRIZIONE || '').length })) }));
            } catch (error) {
              console.log(JSON.stringify({ asset: 'real-projection', error: error.message }));
            }
            for (const apiUrl of [
              'https://chronocol.com/api/w-mobs?pagination%5BpageSize%5D=1',
              'https://chronocol.com/api/w-mob-nazionales?pagination%5BpageSize%5D=1',
              'https://mobilitazioni.chronocol.com/api/w-mobs?pagination%5BpageSize%5D=1'
            ]) {
              try {
                const response = await fetch(apiUrl, {
                  signal: AbortSignal.timeout(8000),
                  headers: { Accept: 'application/json' }
                });
                const body = (await response.text()).slice(0, 400000);
                let json = null;
                try { json = JSON.parse(body); } catch {}
                const sample = json && Array.isArray(json.data) ? json.data[0] : null;
                console.log(JSON.stringify({ apiUrl, status: response.status,
                  contentType: response.headers.get('content-type'),
                  dataCount: Array.isArray(json?.data) ? json.data.length : null,
                  topKeys: json ? Object.keys(json) : [],
                  firstKeys: sample ? Object.keys(sample) : [],
                  attributes: sample?.attributes ? Object.keys(sample.attributes) : [],
                  meta: json?.meta || null }));
              } catch (error) { console.log(JSON.stringify({ apiUrl, error: error.message })); }
            }
          })();
          NODE
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Live read-only Chrono normalization smoke (temporary)
        continue-on-error: true
        run: |
          node <<'NODE'
          const { loadAllPages, notExpired } = require('./api/services/chronocolEventFeedService');
          const upstream = require('./api/node_modules/node-fetch');
          (async () => {
            const all = await loadAllPages(upstream);
            const active = all.filter((item) => notExpired(item));
            const hasSensitive = all.some((item) => 'CONTATTI' in item || 'DESCRIZIONE' in item);
            console.log(JSON.stringify({
              test: 'LIVE_CHRONO_READ_ONLY', verifiedActiveAndHistorical: all.length,
              upcomingOrInProgress: active.length,
              sampleCities: [...new Set(active.map((item) => item.comune_evento))].slice(0, 12),
              hasSensitive, allHaveSource: all.every((item) => item.fonte_url),
              sampleDate: active[0]?.giorno_inizio || null
            }));
            if (hasSensitive || !all.every((item) => item.fonte_url)) process.exitCode = 1;
          })().catch((error) => { console.error('LIVE_CHRONO_SMOKE_FAILED:', error.message); process.exitCode = 1; });
          NODE
      - name: Run Chrono and existing Eventi feed tests
        run: node --test api/tests/chronocolEventFeedService.test.js api/tests/eventFeedService.test.js
      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build --prefix client
