name: Opinion answers v2 — isolated research
on:
  push:
    branches:
      - research/opinion-answers-v2-document-20261030
    paths:
      - "api/experiments/opinionAnswersV2Candidate.js"
      - "api/experiments/opinionAnswersV2BackfillCandidate.js"
      - "api/tests/opinionAnswersV2*.test.js"
      - "api/tests/opinionAnswersV2*.pg.test.js"
      - "api/scripts/benchmark-opinion-answer-layouts-ci.js"
      - "api/docs/opinion-answer-v2-no-column-ddl.md"
      - ".github/workflows/opinion-answers-v2-research.yml"
  pull_request:
    paths:
      - "api/experiments/opinionAnswersV2Candidate.js"
      - "api/tests/opinionAnswersV2Candidate.test.js"
      - "api/tests/opinionAnswersV2Candidate.pg.test.js"
      - "api/tests/opinionAnswersV2Consent.pg.test.js"
      - "api/tests/opinionAnswersV2ManifestCompatibility.test.js"
      - "api/experiments/opinionAnswersV2BackfillCandidate.js"
      - "api/tests/opinionAnswersV2Backfill.pg.test.js"
      - "api/tests/opinionAnswersV2Backfill.unit.test.js"
      - "api/scripts/benchmark-opinion-answer-layouts-ci.js"
      - "api/docs/opinion-answer-v2-no-column-ddl.md"
      - ".github/workflows/opinion-answers-v2-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-contract:
    name: Research-only JSONB contracts, consent and layout benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opinion_answers_ci
          POSTGRES_USER: opinion_ci
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U opinion_ci -d opinion_answers_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPINION_V2_PG_CI_URL: postgresql://opinion_ci:synthetic-only@127.0.0.1:5432/opinion_answers_ci
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned prototype codecs from PR #247 (no source copied)
        uses: actions/checkout@v4
        with:
          ref: 17c935e5ab6e7500297d14e4e3b9c2e822a1a459
          path: _ci_op247
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked API dependencies without running scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Run isolated unit and PostgreSQL 17 contract tests
        run: node --test api/tests/opinionAnswersV2Candidate.test.js api/tests/opinionAnswersV2Candidate.pg.test.js api/tests/opinionAnswersV2Consent.pg.test.js api/tests/opinionAnswersV2ManifestCompatibility.test.js api/tests/opinionAnswersV2Backfill.pg.test.js api/tests/opinionAnswersV2Backfill.unit.test.js
      - name: Measure synthetic layouts and SQL reads
        run: node api/scripts/benchmark-opinion-answer-layouts-ci.js
