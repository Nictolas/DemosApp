name: NPM audit hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "api/package.json"
      - "api/package-lock.json"
      - ".github/workflows/npm-audit-hardening.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install like Render
        run: npm install --ignore-scripts --no-fund

      - name: Capture audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          AUDIT_EXIT=$?
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const metadata = report.metadata?.vulnerabilities || {};
          console.log('AUDIT_COUNTS=' + JSON.stringify(metadata));
          const vulns = Object.entries(report.vulnerabilities || {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            isDirect: v.isDirect,
            via: (v.via || []).map(x => typeof x === 'string' ? x : {
              source: x.source,
              name: x.name,
              title: x.title,
              url: x.url,
              severity: x.severity,
              range: x.range
            }),
            effects: v.effects || [],
            range: v.range,
            fixAvailable: v.fixAvailable
          }));
          console.log('AUDIT_VULNERABILITIES=' + JSON.stringify(vulns));
          NODE
          exit 0

      - name: Upload raw audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-json
          path: api/npm-audit.json
          if-no-files-found: error
          retention-days: 7
