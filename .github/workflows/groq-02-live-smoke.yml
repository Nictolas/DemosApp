name: GROQ-02 live Free smoke on isolated Render

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/groq-02-live-smoke.yml'
      - 'render.groq-free-linked.yaml'
      - 'api/staging/groq_free_standalone_probe.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check sanitized result from deployed Groq Free probe
        env:
          GROQ_PROBE_URL: https://demos-groq-free-linked-qa-hd3y.onrender.com/health/groq
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              os.environ["GROQ_PROBE_URL"],
              headers={"Accept": "application/json"}
          )
          try:
              with urllib.request.urlopen(request, timeout=65) as response:
                  http_status = response.status
                  payload = response.read(1024)
          except urllib.error.HTTPError as exc:
              http_status = exc.code
              payload = exc.read(1024)
          except Exception:
              print("Groq Free live probe: NETWORK_UNAVAILABLE")
              sys.exit(1)

          try:
              obj = json.loads(payload)
          except Exception:
              print("Groq Free live probe: UNRECOGNIZED_RESPONSE")
              sys.exit(1)

          allowed = {
              "OK", "NOT_CONFIGURED", "MODEL_NOT_ALLOWED",
              "FREE_QUOTA_UNAVAILABLE", "EMPTY_OR_TRUNCATED",
              "UNEXPECTED_RESPONSE", "AUTH", "MODEL_NOT_FOUND",
              "INVALID_REQUEST", "RATE_LIMIT", "PROVIDER_UNAVAILABLE",
              "NETWORK_OR_UNKNOWN"
          }
          status = obj.get("status")
          category = status if status in allowed else "UNKNOWN"
          print("Groq Free isolated provider result:", category)
          print("Provider smoke HTTP status:", http_status)
          if http_status != 200 or category != "OK" or obj.get("success") is not True:
              sys.exit(1)
          print("Groq Free live authenticated check passed.")
          PY
