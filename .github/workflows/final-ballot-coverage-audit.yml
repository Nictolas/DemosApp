name: DEMOS Final Ballot Source Coverage Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/scripts/auditFinalNominalCoverage.js'
      - 'api/services/parliamentVerifiedFinalBallotsService.js'
      - 'api/tests/parliamentVerifiedFinalBallots.test.js'
      - 'api/scripts/probeFinalNominalAnomalies.js'
      - '.github/workflows/final-ballot-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate coverage script
        run: node --check api/scripts/auditFinalNominalCoverage.js
      - name: Read-only public source audit of 14 final votes
        run: node api/scripts/auditFinalNominalCoverage.js
