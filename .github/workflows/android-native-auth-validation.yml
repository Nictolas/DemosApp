name: Android Native Auth Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'client/android/app/src/main/java/community/demos/NativeGoogleAuthPlugin.java'
      - 'client/android/app/build.gradle'
      - 'client/android/build.gradle'
      - 'client/android/gradle.properties'
      - 'client/android/gradle/**'
      - '.github/workflows/android-native-auth-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Android debug Java
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon
