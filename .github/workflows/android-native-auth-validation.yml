name: Android Native Auth Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'client/android/app/src/main/java/community/demos/NativeGoogleAuthPlugin.java'
      - 'client/android/app/build.gradle'
      - 'client/android/build.gradle'
      - 'client/android/gradle.properties'
      - 'client/android/gradle/**'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'api/routes/auth/oauth.js'
      - 'api/tests/androidAuthNativePushIntegration.test.js'
      - '.github/workflows/android-native-auth-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Run Android auth regression checks
        run: node --test api/tests/androidAuthNativePushIntegration.test.js

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Android debug Java
        id: compile
        working-directory: client/android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace 2>&1 | tee android-native-auth-compile.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Android compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-auth-compile-log
          path: client/android/android-native-auth-compile.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Android compile result
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
