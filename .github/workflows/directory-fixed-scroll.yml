name: Directory fixed-header scrolling

on:
  pull_request:
    paths:
      - 'client/src/pages/Attivisti.tsx'
      - 'client/src/pages/Organizzazioni/index.tsx'
      - 'client/src/components/RobustAppLayout.tsx'
      - 'client/src/robust-layout.css'
      - 'api/tests/directoryFixedHeaderScroll.smoke.test.js'
      - '.github/workflows/directory-fixed-scroll.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/pages/Attivisti.tsx'
      - 'client/src/pages/Organizzazioni/index.tsx'
      - 'client/src/components/RobustAppLayout.tsx'
      - 'client/src/robust-layout.css'

jobs:
  fixed-directory-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate directory scroll contract and existing Eventi / Notifiche behavior
        run: node --test api/tests/directoryFixedHeaderScroll.smoke.test.js api/tests/eventiScrollContract.test.js api/tests/notificheScrollContract.test.js
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build --prefix client
