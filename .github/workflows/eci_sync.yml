name: Sync ECI (Iniziative Cittadini Europei)

on:
  schedule:
    # Ogni 6 ore: mantiene i dati aggiornati riducendo il consumo di GitHub Actions.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-eci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary

      - name: Sincronizza ECI su Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python api/scripts/sync_eci.py
