name: Sync ECI (Iniziative Cittadini Europei)

on:
  schedule:
    # Una volta al giorno: dati sufficientemente aggiornati con consumo Actions ridotto.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-eci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary

      - name: Sincronizza ECI su Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CIVIC_NEW_INITIATIVE_EVENTS_ENABLED: ${{ vars.CIVIC_NEW_INITIATIVE_EVENTS_ENABLED }}
        run: python api/scripts/sync_eci.py
