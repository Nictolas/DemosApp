name: Sync ECI (Iniziative Cittadini Europei)

on:
  schedule:
    # Una volta al giorno: dati sufficientemente aggiornati con consumo Actions ridotto.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eci-official-sync
  cancel-in-progress: false

jobs:
  sync-eci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze minime
        run: python -m pip install --disable-pip-version-check requests psycopg2-binary

      - name: Sincronizza cache ECI ufficiale
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python api/scripts/sync_eci.py
