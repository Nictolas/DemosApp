name: Sync ECI (Iniziative Cittadini Europei)

on:
  schedule:
    # Una volta al giorno: dati sufficientemente aggiornati con consumo Actions ridotto.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-eci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary

      - name: Sincronizza ECI su Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CIVIC_NEW_INITIATIVE_EVENTS_ENABLED: ${{ vars.CIVIC_NEW_INITIATIVE_EVENTS_ENABLED }}
          CIVIC_RUNTIME_DATABASE_ID: ${{ secrets.CIVIC_RUNTIME_DATABASE_ID }}
        run: python api/scripts/sync_eci.py

      - name: Dispatch notifiche civiche (solo dopo autorizzazione)
        if: ${{ vars.CIVIC_NEW_INITIATIVE_PUSH_ENABLED == 'true' }}
        env:
          CIVIC_PUSH_DISPATCH_URL: ${{ secrets.CIVIC_PUSH_DISPATCH_URL }}
          CIVIC_PUSH_DISPATCH_KEY: ${{ secrets.CIVIC_PUSH_DISPATCH_KEY }}
        run: |
          if [ -z "$CIVIC_PUSH_DISPATCH_URL" ] || [ -z "$CIVIC_PUSH_DISPATCH_KEY" ]; then
            echo "CIVIC_DISPATCH_NOT_CONFIGURED" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
            --request POST \
            --header "X-Civic-Dispatch-Key: ${CIVIC_PUSH_DISPATCH_KEY}" \
            "$CIVIC_PUSH_DISPATCH_URL" > /dev/null
