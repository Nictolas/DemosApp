permissions:
  contents: read
jobs:
  political-consent-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: political_consent_race_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d political_consent_race_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install isolated test dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Check client-side privacy regression
        run: node --test client/tests/politicalOpinionPrivacyCache.test.mjs client/tests/gracePrivacyCache.test.mjs client/tests/headOfStatePrivacyCache.test.mjs client/tests/governmentPrivacyCache.test.mjs client/tests/publicProfilePrivacyClient.test.mjs client/tests/politicalPersonalizationConsentUI.test.mjs
      - name: Install and build production web client
        run: |
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
          npm --prefix client run build
      - name: Verify HTTP abort propagates through actual API client and TanStack Query
        run: node --test client/tests/politicalOpinionHttpCancellation.test.mjs
      - name: Unit consent, ordinary opinion save and revoke privacy guards
        run: node --test --test-concurrency=1 api/tests/opinionDeltaWrites.test.js api/tests/ordinaryUserOpinionSave.test.js api/tests/politicalConsentAtomic.smoke.test.js api/tests/politicalConsentScope.smoke.test.js api/tests/politicalOpinionWriteRules.smoke.test.js api/tests/opinionPrivacy.test.js api/tests/politicalAggregatePrivacy.test.js api/tests/politicalOpinionReadCachePolicy.test.js api/tests/politicalProfileReadConsent.test.js api/tests/politicalMatchingService.test.js api/tests/politicalMatchingRoutes.smoke.test.js api/tests/politicalMatchingRepresentativesRoutes.smoke.test.js api/tests/politicalConsentHttpNoStore.smoke.test.js api/tests/referendumRealVote.smoke.test.js api/tests/legacyReferendumConsentRace.smoke.test.js api/tests/amnestyConsentRevokeRace.smoke.test.js api/tests/headOfStateConsentPrivacy.smoke.test.js api/tests/headOfStateVoteReadPrivacy.test.js api/tests/headOfStateVoteWritePrivacy.test.js api/tests/graceReadPrivacy.test.js api/tests/graceVoteWritePrivacy.test.js api/tests/proposalVoteConsentRace.test.js api/tests/governmentConfidenceConsentRace.test.js api/tests/governmentMinisterVoteConsentRace.test.js api/tests/governmentConfidenceReadPrivacy.test.js api/tests/governmentMinistryReadsPrivacy.test.js api/tests/publicProfileGovernmentConsent.test.js api/tests/publicPoliticalProfile.smoke.test.js api/tests/supporterPoliticalConsentPrivacy.test.js api/tests/politicalSelectionService.test.js api/tests/politicalSelectionWriteConsentRace.test.js api/tests/politicalSelectionRoute.test.js api/tests/politicalRepresentativeSelection.smoke.test.js api/tests/fcmTokenNormalizedHttp.smoke.test.js api/tests/fcmTokenLegacyFallback.test.js api/tests/fcmTokenIntegrity.test.js api/tests/currentSupporterPushService.test.js api/tests/currentSupporterPushPreSendConsent.test.js api/tests/currentSupporterPushQueryBudget.test.js api/tests/politicalOpinionNotificationService.test.js api/tests/ownProfilePoliticalSelectionRead.test.js api/tests/politicalPersonalizationConsentGate.test.js
      - name: Confirm real HTTP save-vs-revoke serialization on synthetic PostgreSQL 17
        env:
          GITHUB_ACTIONS: 'true'
          POLITICAL_CONSENT_RACE_CI: synthetic
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: political_consent_race_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-political-consent-save-race-ci.js
      - name: Verify real PostgreSQL 17 consent-gated reads with residual synthetic answers
        env:
          GITHUB_ACTIONS: 'true'
          POLITICAL_CONSENT_RACE_CI: synthetic
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: political_consent_race_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-political-opinion-read-consent-ci.js

      - name: Verify real PostgreSQL 17 Grazia revoked-vote reads (synthetic only)
        env:
          GITHUB_ACTIONS: 'true'
