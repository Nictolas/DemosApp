name: Political consent save/revoke atomic privacy
on:
  pull_request:
    paths:
      - 'api/routes/opinioni/user-answers.js'
      - 'api/routes/compatibility.js'
      - 'api/config/publicCachePolicy.js'
      - 'api/tests/politicalOpinionReadCachePolicy.test.js'
      - 'api/tests/politicalProfileReadConsent.test.js'
      - 'api/scripts/verify-political-opinion-read-consent-ci.js'
      - 'api/tests/politicalConsentHttpNoStore.smoke.test.js'
      - 'api/routes/users/profile.js'
      - 'api/routes/referendum-vote.js'
      - 'api/tests/referendumRealVote.smoke.test.js'
      - 'api/services/politicalMatchingService.js'
      - 'api/routes/candidati.js'
      - 'api/routes/rappresentanti.js'
      - 'api/tests/politicalMatchingRoutes.smoke.test.js'
      - 'api/tests/politicalMatchingRepresentativesRoutes.smoke.test.js'
      - 'api/tests/politicalMatchingService.test.js'
      - 'api/tests/politicalOpinionWriteRules.smoke.test.js'
      - 'api/routes/user/political-opinions-consent.js'
      - 'api/services/politicalConsentService.js'
      - 'api/tests/ordinaryUserOpinionSave.test.js'
      - 'api/scripts/verify-political-consent-save-race-ci.js'
      - 'api/tests/politicalConsentAtomic.smoke.test.js'
      - 'api/tests/politicalConsentScope.smoke.test.js'
      - 'client/src/pages/GDPR/index.tsx'
      - 'client/src/pages/OpinioniNazionali.tsx'
      - 'client/src/pages/OpinioniRegionali.tsx'
      - 'client/src/pages/OpinioniComunali.tsx'
      - 'client/src/pages/OpinioniEuropee.tsx'
      - 'client/src/pages/StatisticheOpinione/components/OpinionSelector.tsx'
      - 'client/tests/politicalOpinionPrivacyCache.test.mjs'
      - 'client/tests/politicalOpinionHttpCancellation.test.mjs'
      - 'client/src/lib/queryClient.ts'
      - 'client/src/hooks/usePoliticalOpinionsConsent.ts'
      - 'DPIA_DemosApp.md'
      - '.github/workflows/political-consent-save-revoke-ci.yml'
permissions:
  contents: read
jobs:
  political-consent-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: political_consent_race_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d political_consent_race_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install isolated test dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Check client-side privacy regression
        run: node --test client/tests/politicalOpinionPrivacyCache.test.mjs
      - name: Install and build production web client
        run: |
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
          npm --prefix client run build
      - name: Verify HTTP abort propagates through actual API client and TanStack Query
        run: node --test client/tests/politicalOpinionHttpCancellation.test.mjs
      - name: Unit consent, ordinary opinion save and revoke privacy guards
        run: node --test --test-concurrency=1 api/tests/ordinaryUserOpinionSave.test.js api/tests/politicalConsentAtomic.smoke.test.js api/tests/politicalConsentScope.smoke.test.js api/tests/politicalOpinionWriteRules.smoke.test.js api/tests/opinionPrivacy.test.js api/tests/politicalAggregatePrivacy.test.js api/tests/politicalOpinionReadCachePolicy.test.js api/tests/politicalProfileReadConsent.test.js api/tests/politicalMatchingService.test.js api/tests/politicalMatchingRoutes.smoke.test.js api/tests/politicalMatchingRepresentativesRoutes.smoke.test.js api/tests/politicalConsentHttpNoStore.smoke.test.js api/tests/referendumRealVote.smoke.test.js
      - name: Confirm real HTTP save-vs-revoke serialization on synthetic PostgreSQL 17
        env:
          GITHUB_ACTIONS: 'true'
          POLITICAL_CONSENT_RACE_CI: synthetic
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: political_consent_race_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-political-consent-save-race-ci.js
      - name: Verify real PostgreSQL 17 consent-gated reads with residual synthetic answers
        env:
          GITHUB_ACTIONS: 'true'
          POLITICAL_CONSENT_RACE_CI: synthetic
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: political_consent_race_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-political-opinion-read-consent-ci.js
