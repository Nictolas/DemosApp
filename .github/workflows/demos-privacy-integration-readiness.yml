name: DEMOS privacy integration readiness

on:
  pull_request:
    paths:
      - '.github/workflows/demos-privacy-integration-readiness.yml'
      - 'api/docs/privacy-integration-release-gates-20261025.md'
      - 'api/routes/**'
      - 'api/services/**'
      - 'api/tests/**'
      - 'client/src/pages/Profilo/**'

permissions:
  contents: read

jobs:
  integration-diff:
    name: Integration history and patch hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main ancestry (no divergent history)
        shell: bash
        run: |
          git show-ref --verify refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
      - name: Check complete integration diff for whitespace errors
        shell: bash
        run: git diff --check origin/main...HEAD

  backend-regressions:
    name: Wider backend security and authentication regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      SUPABASE_URL: ''
      SUPABASE_DB_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      RENDER: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install backend dependencies without lifecycle scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Identity and CIE authentication regression
        run: npm run --prefix api test:identity
      - name: Passkeys/WebAuthn regression
        run: npm run --prefix api test:webauthn
      - name: Privacy regression outside the specialized PostgreSQL workflow
        run: npm run --prefix api test:privacy
      - name: Audit logging and delivery privacy regression
        run: npm run --prefix api test:logging-privacy
      - name: Security production-hardening regression (offline synthetic only)
        run: npm run --prefix api test:security-hardening
      - name: Firebase Admin compatibility regression
        run: npm run --prefix api test:firebase-admin-compat
