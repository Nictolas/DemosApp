name: Advertising policy validation

on:
  pull_request:
    paths:
      - 'client/src/lib/advertising-policy.ts'
      - 'client/tests/advertisingPolicy.test.mjs'
      - 'client/tests/appOpenNativeContract.test.mjs'
      - 'client/android/app/build.gradle'
      - 'client/android/app/src/main/java/community/demos/MainActivity.java'
      - 'client/android/app/src/main/java/community/demos/NativeAppOpenPrivacyPlugin.java'
      - 'client/src/lib/native-app-open-privacy.ts'
      - 'client/src/pages/Impostazioni/index.tsx'
      - 'client/src/pages/Impostazioni/components/AppOpenPrivacyOptions.tsx'
      - 'client/android/app/src/main/java/community/demos/AppOpenFrequencyPolicy.java'
      - 'client/android/app/src/test/java/community/demos/AppOpenFrequencyPolicyTest.java'
      - 'client/android/app/src/debug/java/community/demos/DemosAppOpenAdsManager.java'
      - 'client/android/app/src/release/java/community/demos/DemosAppOpenAdsManager.java'
      - 'client/android/app/src/debug/AndroidManifest.xml'
      - '.github/workflows/advertising-policy-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advertising-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test advertising deny-by-default policy
        working-directory: client
        run: node --test tests/advertisingPolicy.test.mjs tests/appOpenNativeContract.test.mjs

  android-native-debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Capacitor Android build
        working-directory: client
        run: npm run android:sync
      - name: Compile and unit-test Android debug/release (ads flag OFF)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:compileDebugJavaWithJavac :app:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Confirm release runtime does not include AdMob or UMP
        working-directory: client/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/demos-release-runtime-deps.txt
          if grep -F -e 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk' -e 'com.google.android.ump:user-messaging-platform' /tmp/demos-release-runtime-deps.txt; then
            echo 'ERROR: AdMob or UMP dependency leaked into Android release runtime'
            exit 1
          fi
          echo 'Verified: no advertising SDK in Android release runtime'
