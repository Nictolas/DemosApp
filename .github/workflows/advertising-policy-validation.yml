name: Advertising policy validation

on:
  pull_request:
    paths:
      - 'client/src/lib/advertising-policy.ts'
      - 'client/tests/advertisingPolicy.test.mjs'
      - 'client/tests/appOpenNativeContract.test.mjs'
      - 'api/utils/adsAdultEligibility.js'
      - 'api/tests/ads-adult-eligibility.test.js'
      - 'api/routes/auth/profile.js'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/tests/advertisingPrivacyNotice.test.mjs'
      - 'client/public/app-ads.txt'
      - 'client/public/ads.txt'
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/CookiePolicy.tsx'
      - 'client/android/app/build.gradle'
      - 'client/android/app/src/main/java/community/demos/MainActivity.java'
      - 'client/android/app/src/main/java/community/demos/NativeAppOpenPrivacyPlugin.java'
      - 'client/src/lib/native-app-open-privacy.ts'
      - 'client/src/pages/Impostazioni/index.tsx'
      - 'client/src/pages/LandingPage.tsx'
      - 'client/src/pages/auth-page.tsx'
      - 'client/src/pages/Impostazioni/components/AppOpenPrivacyOptions.tsx'
      - 'client/android/app/src/main/java/community/demos/AppOpenFrequencyPolicy.java'
      - 'client/android/app/src/main/java/community/demos/AppOpenTcfConsentPolicy.java'
      - 'client/android/app/src/test/java/community/demos/AppOpenTcfConsentPolicyTest.java'
      - 'client/android/app/src/test/java/community/demos/AppOpenFrequencyPolicyTest.java'
      - 'client/android/app/src/debug/java/community/demos/DemosAppOpenAdsManager.java'
      - 'client/android/app/src/release/java/community/demos/DemosAppOpenAdsManager.java'
      - 'client/android/app/src/debug/AndroidManifest.xml'
      - '.github/workflows/advertising-policy-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advertising-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test advertising deny-by-default policy
        working-directory: client
        run: node --test tests/advertisingPolicy.test.mjs tests/appOpenNativeContract.test.mjs tests/advertisingPrivacyNotice.test.mjs
      - name: Test server-side conservative adult eligibility
        working-directory: client
        run: node --test ../api/tests/ads-adult-eligibility.test.js

  android-native-debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Capacitor Android build
        working-directory: client
        run: npm run android:sync
      - name: Verify app-ads.txt is included unchanged in built website assets
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-ads.txt
          diff -u public/app-ads.txt dist/app-ads.txt
          echo "Verified app-ads.txt in build root"
      - name: Compile and unit-test Android debug/release (ads flag OFF)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:compileDebugJavaWithJavac :app:compileReleaseJavaWithJavac --no-daemon --stacktrace
      - name: Compile explicit EEA UMP debug QA mode with Google sample App ID
        working-directory: client/android
        run: |
          ./gradlew :app:compileDebugJavaWithJavac :app:compileReleaseJavaWithJavac \
            -PdemosDebugAppOpenAds=true \
            -PdemosDebugUmpEea=true \
            -PdemosDebugAdMobAppId=ca-app-pub-3940256099942544~3347511713 \
            --no-daemon

      - name: Confirm release runtime does not include AdMob or UMP
        working-directory: client/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/demos-release-runtime-deps.txt
          if grep -F -e 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk' -e 'com.google.android.ump:user-messaging-platform' /tmp/demos-release-runtime-deps.txt; then
            echo 'ERROR: AdMob or UMP dependency leaked into Android release runtime'
            exit 1
          fi
          echo 'Verified: no advertising SDK in Android release runtime'

      - name: Verify packaged unsigned release APK excludes ad ID and AdMob
        working-directory: client/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$sdk/build-tools"
          aapt="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          perms="$("$aapt" dump permissions "$apk")"
          manifest="$("$aapt" dump xmltree "$apk" AndroidManifest.xml)"
          badging="$("$aapt" dump badging "$apk")"
          if ! grep -Fq "package: name='community.demos'" <<< "$badging"; then
            echo 'ERROR: unexpected package name in release APK'
            exit 1
          fi
          if grep -Fq "com.google.android.gms.permission.AD_ID" <<< "$perms"; then
            echo 'ERROR: advertising ID permission leaked into current Ads-free release'
            exit 1
          fi
          if grep -Fq "com.google.android.gms.ads.APPLICATION_ID" <<< "$manifest" || grep -Fq "ca-app-pub-" <<< "$manifest"; then
            echo 'ERROR: AdMob manifest metadata or ID leaked into Ads-free release'
            exit 1
          fi
          echo 'Verified: compiled release APK has no AdMob App ID or AD_ID permission'
