name: Render Blueprint static release guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'render.yaml'
      - 'api/tests/renderBlueprintManualDeploy.test.js'
      - '.github/workflows/render-blueprint-static-release-guard.yml'
permissions:
  contents: read
jobs:
  blueprint-static-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify production Blueprint syntax and LIVE configuration snapshot
        run: node --test api/tests/renderBlueprintManualDeploy.test.js
