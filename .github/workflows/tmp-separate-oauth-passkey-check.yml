name: Temporary OAuth Passkey separation check

on:
  push:
    branches:
      - separate-oauth-registration-from-passkey

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install client dependencies
        working-directory: client
        run: npm install
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Verify OAuth and Passkey separation
        run: |
          grep -q 'RegistrazioneCompletaOAuth' client/src/pages/registrazione-crea-passkey.tsx
          grep -q 'RegistrazionePasskey' client/src/pages/registrazione-crea-passkey.tsx
          grep -q '/auth/oauth/complete-registration' client/src/pages/registrazione-completa-oauth.tsx
          if grep -q '@/lib/webauthn' client/src/pages/registrazione-completa-oauth.tsx; then
            echo "La pagina OAuth dipende ancora da WebAuthn"
            exit 1
          fi
          if grep -q 'complete-registration' client/src/pages/registrazione-passkey.tsx; then
            echo "La pagina Passkey contiene ancora il completamento OAuth"
            exit 1
          fi
          if grep -q 'registrazione_oauth_flow' client/src/pages/registrazione-passkey.tsx; then
            echo "La pagina Passkey contiene ancora stato OAuth"
            exit 1
          fi
          echo "Separazione OAuth/Passkey OK"
