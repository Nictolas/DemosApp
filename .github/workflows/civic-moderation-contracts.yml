name: Civic privacy and moderation contracts
on:
  pull_request:
    branches:
      - main
      - fix/notification-recipient-reactions-auth-20261031
    paths:
      - 'api/routes/notifiche.js'
      - 'api/routes/reazioni-comunicazioni.js'
      - 'api/routes/grazia.js'
      - 'api/routes/amnistia.js'
      - 'api/routes/capo-stato.js'
      - 'api/tests/notificationRecipientAndReactionsSecurity.test.js'
      - 'api/tests/civicPrivacyHttp.synthetic.test.js'
      - 'api/tests/graziaModerationContract.test.js'
      - 'api/tests/graziaModerationHttp.synthetic.test.js'
      - 'api/tests/graziaPostgresConcurrency.integration.test.js'
      - 'api/tests/capoApprovedCatalogue.pg.integration.test.js'
      - 'api/tests/subjectProposalLifecycle.pg.integration.test.js'
      - 'api/migrations/20261031_subject_proposals_review_gate.sql'
      - 'api/routes/subject-proposals.js'
      - 'api/tests/civicSubjectPublicationGate.test.js'
      - 'api/tests/civicCatalogueRejectionHttp.synthetic.test.js'
      - 'client/src/pages/Grazia/**'
      - 'client/src/pages/Amnistia/**'
      - 'client/src/pages/GestisciGrazia.tsx'
      - '.github/workflows/civic-moderation-contracts.yml'
  push:
    branches:
      - fix/notification-recipient-reactions-auth-20261031
      - feat/repair-grazia-approval-20261031
      - fix/amnistia-capo-approval-gates-20261031
      - feat/proposals-integration-20261031
permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check changed backend parse
        run: |
          node --check api/routes/notifiche.js
          node --check api/routes/reazioni-comunicazioni.js
          node --check api/routes/grazia.js
          node --check api/routes/amnistia.js
          node --check api/routes/capo-stato.js
      - name: Privacy and reaction tests
        run: node --test api/tests/notificationRecipientAndReactionsSecurity.test.js
      - name: Install isolated HTTP testing dependencies (no database)
        run: npm install --prefix /tmp/demos-http-test --no-save --ignore-scripts --no-audit --no-fund express@4.22.3 dotenv@16.3.1 jsonwebtoken@9.0.2
      - name: Two-user privacy isolation via synthetic HTTP
        env:
          NODE_PATH: /tmp/demos-http-test/node_modules
        run: node --test api/tests/civicPrivacyHttp.synthetic.test.js
      - name: Grazia moderation tests (when branch contains repair)
        run: |
          if test -f api/tests/graziaModerationContract.test.js; then node --test api/tests/graziaModerationContract.test.js; fi
      - name: Synthetic Grazia moderation HTTP checks
        env:
          NODE_PATH: /tmp/demos-http-test/node_modules
        run: |
          if test -f api/tests/graziaModerationHttp.synthetic.test.js; then
            node --test api/tests/graziaModerationHttp.synthetic.test.js
          fi
      - name: Reject unreviewed new subjects via isolated HTTP
        env:
          NODE_PATH: /tmp/demos-http-test/node_modules
        run: node api/tests/civicCatalogueRejectionHttp.synthetic.test.js
      - name: Amnesty / head-of-state gates (when present)
        run: |
          if test -f api/tests/civicSubjectPublicationGate.test.js; then node --test api/tests/civicSubjectPublicationGate.test.js; fi
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demos_ci
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: demos_civic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demos_ci -d demos_civic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install disposable Postgres integration dependencies
        run: npm install --prefix /tmp/demos-civic-pg --no-save --ignore-scripts --no-audit --no-fund pg@8.11.3 express@4.22.3
      - name: Verify concurrent Grazia moderation using real ephemeral PostgreSQL
        env:
          NODE_PATH: /tmp/demos-civic-pg/node_modules
          CIVIC_TEST_DATABASE_URL: postgres://demos_ci:synthetic_only@127.0.0.1:5432/demos_civic_ci
          CIVIC_TEST_MODE: isolated-synthetic
        run: node --test api/tests/graziaPostgresConcurrency.integration.test.js
      - name: Verify Capo di Stato approved catalogue, zero-vote ranking and vote whitelist on PG17
        env:
          NODE_PATH: /tmp/demos-civic-pg/node_modules
          CIVIC_TEST_DATABASE_URL: postgres://demos_ci:synthetic_only@127.0.0.1:5432/demos_civic_ci
          CIVIC_TEST_MODE: isolated-synthetic
        run: node --test api/tests/capoApprovedCatalogue.pg.integration.test.js
      - name: Verify proposal migration, unique pending, moderation and deletion on isolated PG17
        env:
          NODE_PATH: /tmp/demos-civic-pg/node_modules
          CIVIC_TEST_DATABASE_URL: postgres://demos_ci:synthetic_only@127.0.0.1:5432/demos_civic_ci
          CIVIC_TEST_MODE: isolated-synthetic
        run: node --test api/tests/subjectProposalLifecycle.pg.integration.test.js
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix client
