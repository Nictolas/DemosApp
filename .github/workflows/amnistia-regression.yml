name: Amnistia catalog regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/routes/amnistia.js'
      - 'api/routes/subject-proposals.js'
      - 'api/services/amnistiaCatalog.js'
      - 'api/catalog/amnistia.json'
      - 'api/tests/amnistiaVersionedCatalog.test.js'
      - 'api/tests/amnistiaCatalogContract.test.js'
      - '20261022_amnistia_catalogo_reati.sql'
      - 'client/src/pages/Amnistia/**'
      - '.github/workflows/amnistia-regression.yml'

permissions:
  contents: read

jobs:
  amnistia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Check backend syntax
        run: |
          node --check api/routes/amnistia.js
          node --check api/services/amnistiaCatalog.js
          node --check api/routes/subject-proposals.js
      - name: Verify catalog regression
        run: node --test api/tests/amnistiaCatalogContract.test.js api/tests/amnistiaVersionedCatalog.test.js
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix client run build
