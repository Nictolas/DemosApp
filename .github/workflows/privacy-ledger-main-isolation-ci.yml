name: GDPR ledger isolated main security regression

on:
  pull_request:
    paths:
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/tests/privacyLedgerSecureBootstrap.pg17.test.js'
      - 'api/tests/legacyLinkedRows.integration.test.js'
      - '.github/workflows/privacy-ledger-main-isolation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-ledger-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: privacy_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d privacy_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install backend dependencies without lifecycle scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify syntax of minimal main-based correction
        run: |
          node --check api/services/privacyErasureLedgerService.js
          node --check api/tests/privacyLedgerSecureBootstrap.pg17.test.js
          node --check api/tests/legacyLinkedRows.integration.test.js
      - name: Check secure first creation and preinstalled-ledger deletion regression on disposable PG17
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@localhost:5432/privacy_synthetic
        run: |
          node --test --test-concurrency=1 api/tests/privacyLedgerSecureBootstrap.pg17.test.js
          node --test --test-concurrency=1 api/tests/legacyLinkedRows.integration.test.js
