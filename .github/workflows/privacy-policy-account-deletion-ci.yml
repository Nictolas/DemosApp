name: Privacy Policy account deletion guidance (synthetic)
on:
  pull_request:
    paths:
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/tests/privacyPolicyAccountDeletion.test.mjs'
      - '.github/workflows/privacy-policy-account-deletion-ci.yml'
permissions:
  contents: read
jobs:
  policy-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Check policy language invariants
        run: node --test client/tests/privacyPolicyAccountDeletion.test.mjs
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Compile frontend
        run: npm run build --prefix client
