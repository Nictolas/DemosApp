name: Privacy Policy account deletion guidance (synthetic)
on:
  # Validate this isolated draft branch even before the workflow exists on main.
  # No deployment, account data, providers or production credentials.
  push:
    branches: [fix/clarify-passkey-deletion-privacy-policy-20261031]
    paths:
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/LandingPage.tsx'
      - 'client/src/pages/ScopriDemos.tsx'
      - 'client/src/pages/Impostazioni/InformazioniLegali/index.tsx'
      - 'client/src/pages/Impostazioni/components/LinksSection.tsx'
      - 'client/src/pages/registrazione-consensi.tsx'
      - 'client/src/App.tsx'
      - 'api/tests/legalPolicyLinks.smoke.test.js'
      - 'client/tests/privacyDisclosureIntegrity.test.mjs'
      - 'client/tests/privacyPolicyAccountDeletion.test.mjs'
      - '.github/workflows/privacy-policy-account-deletion-ci.yml'
  pull_request:
    paths:
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/LandingPage.tsx'
      - 'client/src/pages/ScopriDemos.tsx'
      - 'client/src/pages/Impostazioni/InformazioniLegali/index.tsx'
      - 'client/src/pages/Impostazioni/components/LinksSection.tsx'
      - 'client/src/pages/registrazione-consensi.tsx'
      - 'client/src/App.tsx'
      - 'api/tests/legalPolicyLinks.smoke.test.js'
      - 'client/tests/privacyDisclosureIntegrity.test.mjs'
      - 'client/tests/privacyPolicyAccountDeletion.test.mjs'
      - '.github/workflows/privacy-policy-account-deletion-ci.yml'
permissions:
  contents: read
jobs:
  policy-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Check policy language invariants
        run: node --test client/tests/privacyPolicyAccountDeletion.test.mjs client/tests/privacyDisclosureIntegrity.test.mjs
      - name: Verify legal navigation in registration, Settings, and public routes
        run: node --test api/tests/legalPolicyLinks.smoke.test.js
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Compile frontend
        run: npm run build --prefix client
