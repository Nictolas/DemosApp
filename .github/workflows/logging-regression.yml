name: Logging and archive regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/services/centralizedLogger.js'
      - 'api/utils/axiomSecurityEvent.js'
      - 'api/tests/axiomSecurityEvent.test.js'
      - 'api/services/auditService.js'
      - 'api/services/auditOutboxService.js'
      - 'api/services/auditOutboxDatabase.js'
      - 'api/services/auditOutboxProjectScope.js'
      - 'api/tests/auditOutboxProjectScope.test.js'
      - 'api/services/auditOutboxStagingGuard.js'
      - 'api/scripts/verify-audit-outbox-staging.js'
      - 'api/tests/auditOutboxStagingGuard.test.js'
      - 'api/tests/auditOutboxDatabase.test.js'
      - 'api/services/auditOutboxAlertService.js'
      - 'api/tests/auditOutboxAlertService.test.js'
      - 'api/jobs/auditOutboxWorker.js'
      - 'api/app.js'
      - 'api/tests/auditOutboxService.test.js'
      - 'api/tests/auditOutboxWorker.test.js'
      - 'api/tests/auditOutboxPostgres.test.js'
      - 'api/tests/auditOutboxRealPostgres.test.js'
      - 'docs/operations/AUDIT_OUTBOX_DESIGN_2026-10-21.md'
      - 'docs/operations/AUDIT_OUTBOX_RETENTION_PROPOSAL_2026-10-21.md'
      - 'docs/operations/SUPABASE_OUTBOX_STAGING_VERIFICATION_2026-10-21.md'
      - 'api/services/axiomArchiveService.js'
      - 'api/services/archiveOverlapVerifier.js'
      - 'api/services/archiveOverlapB2Reader.js'
      - 'api/tests/archiveOverlapB2Reader.test.js'
      - 'api/tests/archiveOverlapVerifier.test.js'
      - 'api/scripts/verify-axiom-archive-overlap.js'
      - 'docs/operations/axiom-b2-log-archive.md'
      - 'api/scripts/verify-latest-axiom-archive.js'
      - 'api/utils/log*.js'
      - 'api/utils/archiveEventClassification.js'
      - 'api/utils/axiomAuditEvent.js'
      - 'api/tests/log*.test.js'
      - 'api/tests/axiomArchiveService.test.js'
      - 'api/tests/archiveEventClassification.test.js'
      - 'api/tests/axiomAuditEvent.test.js'
      - 'api/tests/auditServiceDelivery.test.js'
      - 'api/package.json'
      - 'api/package-lock.json'
      - '.github/workflows/logging-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies from lockfile
        working-directory: api
        run: npm ci --ignore-scripts
      - name: Syntax check logging modules
        working-directory: api
        run: |
          node --check services/centralizedLogger.js
          node --check utils/axiomSecurityEvent.js
          node --check services/auditService.js
          node --check services/auditOutboxService.js
          node --check services/auditOutboxDatabase.js
          node --check services/auditOutboxProjectScope.js
          node --check services/auditOutboxStagingGuard.js
          node --check scripts/verify-audit-outbox-staging.js
          node --check services/auditOutboxAlertService.js
          node --check jobs/auditOutboxWorker.js
          node --check app.js
          node --check services/axiomArchiveService.js
          node --check services/archiveOverlapVerifier.js
          node --check services/archiveOverlapB2Reader.js
          node --check scripts/verify-axiom-archive-overlap.js
          node --check scripts/verify-latest-axiom-archive.js
      - name: Logging privacy and delivery tests
        working-directory: api
        run: npm run test:logging-privacy
      - name: Axiom archive and classification tests (mocked, no production credentials)
        working-directory: api
        run: npm run test:axiom-archive
      - name: Production dependency audit
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

  postgres-outbox:
    # Real, disposable PostgreSQL service on the CI runner. NEVER production.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demos_outbox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d demos_outbox_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci --ignore-scripts
      - name: Real PostgreSQL audit outbox concurrency and crash-recovery test
        working-directory: api
        env:
          DEMOS_OUTBOX_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/demos_outbox_ci
        run: node --test tests/auditOutboxRealPostgres.test.js
