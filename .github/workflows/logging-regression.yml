name: Logging and archive regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/services/centralizedLogger.js'
      - 'api/services/ministeroSync.js'
      - 'api/routes/ministero.js'
      - 'api/routes/opinioni-proposte.js'
      - 'api/routes/user/delete-account.js'
      - 'api/tests/accountDeletionAuditPrivacy.test.js'
      - 'api/tests/logOpinionProposalMinimization.test.js'
      - 'api/services/auditService.js'
      - 'api/services/axiomMigrationService.js'
      - 'api/routes/auth/profile.js'
      - 'api/routes/auth/logout.js'
      - 'api/tests/logoutSessionEndToEnd.synthetic.test.js'
      - 'api/tests/logoutRealStores.integration.test.js'
      - 'api/tests/logoutUpstashRestTransport.integration.test.js'
      - 'api/routes/comunicazioni.js'
      - 'api/tests/logCredentialMinimization.test.js'
      - 'api/tests/diagnosticTokenMinimization.smoke.test.js'
      - 'api/tests/unapprovedLogRetentionGuard.smoke.test.js'
      - 'api/routes/admin/audit-dashboard.js'
      - 'api/routes/admin/logging.js'
      - 'client/src/hooks/useFCM.ts'
      - 'scripts/*axiom*.js'
      - 'scripts/test-token-ingest-direct.js'
      - 'scripts/test-apl-query.js'
      - 'scripts/test-dataset-api.js'
      - 'api/services/axiomArchiveService.js'
      - 'api/scripts/verify-latest-axiom-archive.js'
      - 'api/utils/log*.js'
      - 'api/utils/archiveEventClassification.js'
      - 'api/utils/axiomAuditEvent.js'
      - 'api/tests/log*.test.js'
      - 'api/tests/axiomArchiveService.test.js'
      - 'api/tests/archiveEventClassification.test.js'
      - 'api/tests/axiomAuditEvent.test.js'
      - 'api/tests/auditServiceDelivery.test.js'
      - 'api/package.json'
      - 'api/package-lock.json'
      - '.github/workflows/logging-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies from lockfile
        working-directory: api
        run: npm ci --ignore-scripts
      - name: Syntax check logging modules
        working-directory: api
        run: |
          node --check services/centralizedLogger.js
          node --check services/ministeroSync.js
          node --check routes/ministero.js
          node --check services/auditService.js
          node --check services/axiomArchiveService.js
          node --check scripts/verify-latest-axiom-archive.js
      - name: Proposal vote privacy regression (synthetic, no DB)
        working-directory: api
        run: |
          node --check routes/opinioni-proposte.js
          node --test tests/logOpinionProposalMinimization.test.js
      - name: Account deletion audit privacy regression (synthetic, no DB)
        working-directory: api
        run: |
          node --check routes/user/delete-account.js
          node --test tests/accountDeletionAuditPrivacy.test.js
      - name: Logging privacy and delivery tests
        working-directory: api
        run: |
          npm run test:logging-privacy
          node --test tests/logMinisteroSyncMinimization.test.js
      - name: Operational alert privacy and readability regression
        working-directory: api
        run: |
          node --check services/operationalAlertService.js
          node --check services/centralizedLogger.js
          node --check routes/notifiche.js
          node --check routes/comunicazioni.js
          node --test tests/operationalAlerts.smoke.test.js
      - name: Credential log minimization regression
        working-directory: api
        run: |
          node --check routes/auth/profile.js
          node --check routes/auth/logout.js
          node --test tests/logLogoutErrorMinimization.test.js
          node --test tests/logoutSessionEndToEnd.synthetic.test.js
          node --check routes/comunicazioni.js
          node --check services/axiomMigrationService.js
          node --test tests/logCredentialMinimization.test.js tests/diagnosticTokenMinimization.smoke.test.js tests/unapprovedLogRetentionGuard.smoke.test.js
          node --check routes/admin/audit-dashboard.js
          node --check routes/admin/logging.js
          for file in ../scripts/verifica-token-axiom.js ../scripts/verify-axiom-data.js ../scripts/check-axiom-simple-query.js ../scripts/test-token-ingest-direct.js ../scripts/test-axiom-token.js ../scripts/test-axiom-sdk-stats.js ../scripts/test-axiom-direct-curl.js ../scripts/test-axiom-varianti.js ../scripts/test-apl-query.js ../scripts/test-dataset-api.js; do node --check "$file"; done
      - name: Build frontend to validate FCM hook
        run: |
          npm ci --prefix client --ignore-scripts
          npm run build --prefix client
      - name: Axiom archive and classification tests (mocked, no production credentials)
        working-directory: api
        run: npm run test:axiom-archive
      - name: Production dependency audit
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

  logout-real-stores:
    name: Disposable real PostgreSQL and Redis logout integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: demos_logout_ci
          POSTGRES_USER: demos_ci
          POSTGRES_PASSWORD: disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demos_ci -d demos_logout_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies from lockfile
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify access and refresh revocation using disposable real stores
        timeout-minutes: 4
        env:
          CI: 'true'
          DEMOS_DISPOSABLE_LOGOUT_STORES: 'true'
          DEMOS_LOGOUT_CI_POSTGRES_URL: postgresql://demos_ci:disposable-only@127.0.0.1:5432/demos_logout_ci
          DEMOS_LOGOUT_CI_REDIS_URL: redis://127.0.0.1:6379
        run: node --test --test-concurrency=1 api/tests/logoutRealStores.integration.test.js
      - name: Verify production Upstash REST SDK against loopback Redis adapter
        timeout-minutes: 4
        env:
          CI: 'true'
          DEMOS_DISPOSABLE_LOGOUT_STORES: 'true'
          DEMOS_LOGOUT_CI_REDIS_URL: redis://127.0.0.1:6379
        run: node --test --test-concurrency=1 api/tests/logoutUpstashRestTransport.integration.test.js
