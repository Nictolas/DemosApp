name: Political selection revocation erasure (synthetic)

on:
  # This stacked Draft introduces its own workflow; the parent branch does
  # not contain it, so a pull_request event may publish no checks.
  # Push verification is limited to this Draft branch and synthetic fixtures.
  push:
    branches:
      - 'fix/gdpr-personal-selections-on-secure-ledger-20261027'
    paths:
      - 'api/scripts/attest-gdpr-writer-readonly.js'
      - 'api/tests/gdprWriterReadonlyAttestation.test.js'
      - 'api/services/politicalConsentService.js'
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/tests/politicalSelectionRevocationErasure.test.js'
      - '.github/workflows/political-selection-erasure-ci.yml'
  pull_request:
    paths:
      - 'api/services/politicalConsentService.js'
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/routes/user/political-opinions-consent.js'
      - 'api/tests/politicalSelectionRevocationErasure.test.js'
      - 'api/scripts/verify-political-selection-erasure-ci.js'
      - 'api/scripts/verify-gdpr-writer-pool-ci.js'
      - 'api/scripts/attest-gdpr-writer-readonly.js'
      - 'api/tests/gdprWriterReadonlyAttestation.test.js'
      - 'api/services/gdprExternalEvidenceVerifier.js'
      - 'api/tests/gdprExternalEvidenceVerifier.test.js'
      - '.github/workflows/political-selection-erasure-ci.yml'

permissions:
  contents: read

jobs:
  political-selection-erasure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: political_selection_erasure_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d political_selection_erasure_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install isolated API packages
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Unit check schema-aware erasure, scope and consent
        run: |
          node --check api/scripts/verify-political-selection-erasure-ci.js
          node --check api/scripts/verify-gdpr-writer-pool-ci.js
          node --check api/scripts/attest-gdpr-writer-readonly.js
          node --test api/tests/gdprWriterReadonlyAttestation.test.js
          node --check api/services/gdprExternalEvidenceVerifier.js
          node --test api/tests/gdprExternalEvidenceVerifier.test.js
          node --test --test-concurrency=1 api/tests/politicalSelectionRevocationErasure.test.js api/tests/politicalConsentScope.smoke.test.js api/tests/politicalConsentAtomic.smoke.test.js
      - name: Real PostgreSQL 17 restore and erase political selections
        env:
          GITHUB_ACTIONS: 'true'
          POLITICAL_SELECTION_ERASURE_CI: isolated
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: political_selection_erasure_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-political-selection-erasure-ci.js
      - name: Backend database pool writer-role RLS and rollback on local PG17
        env:
          GITHUB_ACTIONS: 'true'
          GDPR_WRITER_POOL_CI: isolated
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: political_selection_erasure_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-gdpr-writer-pool-ci.js
