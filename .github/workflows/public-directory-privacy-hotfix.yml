name: Public directory privacy hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/routes/attivisti.js'
      - 'api/routes/organizzazioni.js'
      - 'api/services/publicDirectoryMemberProjection.js'
      - 'api/tests/publicDirectoryPrivacyHotfix.synthetic.test.js'
      - 'api/tests/publicDirectoryPrivacyHttp.synthetic.test.js'
      - '.github/workflows/public-directory-privacy-hotfix.yml'

permissions:
  contents: read

jobs:
  synthetic-privacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Parse touched backend code
        run: |
          node --check api/services/publicDirectoryMemberProjection.js
          node --check api/routes/attivisti.js
          node --check api/routes/organizzazioni.js
          node --check api/tests/publicDirectoryPrivacyHotfix.synthetic.test.js
          node --check api/tests/publicDirectoryPrivacyHttp.synthetic.test.js
      - name: Synthetic non-PII public directory contract
        run: node --test api/tests/publicDirectoryPrivacyHotfix.synthetic.test.js
      - name: Install only synthetic HTTP runtime dependencies (no database)
        run: npm install --prefix /tmp/demos-directory-http --no-save --ignore-scripts --no-audit --no-fund express@4.22.3 dotenv@16.3.1
      - name: Real Express routers with fake PostgreSQL via loopback HTTP
        env:
          NODE_PATH: /tmp/demos-directory-http/node_modules
        run: node --test api/tests/publicDirectoryPrivacyHttp.synthetic.test.js
