name: Opinioni regression

on:
  pull_request:
    paths:
      - 'api/routes/opinioni/**'
      - 'api/utils/opinionStatsColumns.js'
      - 'api/tests/opinionStatsColumns.test.js'
      - 'client/src/components/OpinionStatsBar.tsx'
      - 'client/src/pages/Opinioni*.tsx'
      - 'client/src/lib/saveAndVerifyOpinions.ts'
      - '.github/workflows/opinioni-regression.yml'

permissions:
  contents: read

jobs:
  opinioni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify opinion regressions
        run: node --test api/tests/opinionStatsColumns.test.js api/tests/politicalOpinionWriteRules.smoke.test.js api/tests/opinionPrivacy.test.js
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix client run build
