name: Opinioni regression

on:
  push:
    branches:
      - 'feat/opinioni-delta-cache-prep-20261029'
    paths:
      - 'client/tests/encryptedOpinionCategory.behavior.test.mjs'
      - 'client/tests/politicalConsentVerifiedReuse.test.mjs'
      - 'client/tests/politicalConsentGrantVerified.test.mjs'
      - 'client/src/components/PoliticalOpinionsConsentModal.tsx'
      - 'client/src/pages/Opinioni*.tsx'
      - 'client/src/hooks/usePoliticalOpinionsConsent.ts'
      - 'client/src/lib/opinionSaveSession.ts'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/src/pages/Profilo/utils/encryptedProfileVault.ts'
      - 'client/src/lib/encryptedOpinionCache.ts'
      - 'client/tests/saveAndVerifyOpinions.test.mjs'
      - 'client/tests/statsOpinionCacheReuse.test.mjs'
      - 'client/src/pages/StatisticheOpinione/components/OpinionSelector.tsx'
      - 'client/src/pages/StatisticheOpinione/hooks/useOpinionId.ts'
      - 'client/tests/opinionPayload.test.mjs'
      - '.github/workflows/opinioni-regression.yml'
  pull_request:
    paths:
      - 'api/routes/opinioni/**'
      - 'api/utils/opinionStatsColumns.js'
      - 'api/tests/opinionStatsColumns.test.js'
      - 'api/tests/ordinaryUserOpinionSave.test.js'
      - 'client/src/components/OpinionStatsBar.tsx'
      - 'client/src/components/ui/toast.tsx'
      - 'client/src/components/ui/toaster.tsx'
      - 'client/tests/toastOpaque.test.mjs'
      - 'client/src/components/ErrorBoundary.tsx'
      - 'client/src/lib/crashDiagnostic.ts'
      - 'client/tests/crashDiagnostic.test.mjs'
      - 'client/src/pages/Opinioni*.tsx'
      - 'client/src/lib/saveAndVerifyOpinions.ts'
      - 'client/src/lib/opinionDelta.ts'
      - 'client/src/lib/encryptedOpinionCache.ts'
      - 'client/src/pages/Profilo/utils/encryptedProfileVault.ts'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/src/pages/Impostazioni/hooks/useLogout.ts'
      - 'client/tests/authLogRedaction.test.mjs'
      - 'client/tests/opinionDelta.test.mjs'
      - 'client/src/components/PoliticalOpinionsConsentModal.tsx'
      - 'client/tests/politicalConsentGrantVaultBarrier.test.mjs'
      - 'client/tests/politicalOpinionHttpCancellation.test.mjs'
      - 'client/tests/politicalOpinionPrivacyIntegration.test.mjs'
      - 'client/tests/encryptedVaultPurgeRace.test.mjs'
      - 'client/tests/accountDeletionCachePurge.test.mjs'
      - 'client/tests/authInvalidationBarrier.test.mjs'
      - 'client/tests/privacyDisclosureIntegrity.test.mjs'
      - 'client/tests/dpiaReviewStatus.test.mjs'
      - 'docs/privacy/DPIA_RELEASE_RECONCILIATION_2026-10-30.md'
      - 'DPIA_DemosApp.md'
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/RegistroTrattamenti.tsx'
      - 'client/src/pages/Impostazioni/CancellaAccount/index.tsx'
      - 'client/src/pages/StatisticheOpinione/components/OpinionSelector.tsx'
      - 'client/src/lib/queryClient.ts'
      - 'client/src/pages/GDPR/index.tsx'
      - '.github/workflows/opinioni-regression.yml'
      - 'client/src/lib/opinionPayload.ts'
      - 'client/tests/opinionPayload.test.mjs'
      - 'client/tests/encryptedOpinionCategory.behavior.test.mjs'
      - 'client/tests/politicalConsentVerifiedReuse.test.mjs'
      - 'client/tests/politicalConsentGrantVerified.test.mjs'
      - 'client/src/hooks/usePoliticalOpinionsConsent.ts'
      - 'client/src/lib/opinionSaveSession.ts'
      - 'client/tests/saveAndVerifyOpinions.test.mjs'
      - 'client/tests/statsOpinionCacheReuse.test.mjs'
      - 'client/src/pages/StatisticheOpinione/hooks/useOpinionId.ts'

permissions:
  contents: read

jobs:
  opinioni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Test mobile crash diagnostic and toast opacity
        run: node --experimental-strip-types --test client/tests/crashDiagnostic.test.mjs client/tests/toastOpaque.test.mjs client/tests/opinionDelta.test.mjs client/tests/politicalOpinionHttpCancellation.test.mjs client/tests/politicalConsentGrantVaultBarrier.test.mjs client/tests/politicalOpinionPrivacyIntegration.test.mjs client/tests/encryptedVaultPurgeRace.test.mjs client/tests/accountDeletionCachePurge.test.mjs client/tests/authInvalidationBarrier.test.mjs client/tests/authLogRedaction.test.mjs client/tests/privacyDisclosureIntegrity.test.mjs client/tests/dpiaReviewStatus.test.mjs client/tests/opinionPayload.test.mjs client/tests/encryptedOpinionCategory.behavior.test.mjs client/tests/saveAndVerifyOpinions.test.mjs client/tests/statsOpinionCacheReuse.test.mjs client/tests/politicalConsentVerifiedReuse.test.mjs client/tests/politicalConsentGrantVerified.test.mjs
      - name: Build frontend
        run: npm --prefix client run build
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify opinion regressions
        run: node --test --test-concurrency=1 api/tests/opinionStatsColumns.test.js api/tests/ordinaryUserOpinionSave.test.js api/tests/politicalOpinionWriteRules.smoke.test.js api/tests/opinionPrivacy.test.js
