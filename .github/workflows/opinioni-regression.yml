name: Opinioni regression

on:
  pull_request:
    paths:
      - 'api/routes/opinioni/**'
      - 'api/utils/opinionStatsColumns.js'
      - 'api/tests/opinionStatsColumns.test.js'
      - 'api/tests/ordinaryUserOpinionSave.test.js'
      - 'client/src/components/OpinionStatsBar.tsx'
      - 'client/src/components/ui/toast.tsx'
      - 'client/src/components/ui/toaster.tsx'
      - 'client/tests/toastOpaque.test.mjs'
      - 'client/src/components/ErrorBoundary.tsx'
      - 'client/src/lib/crashDiagnostic.ts'
      - 'client/tests/crashDiagnostic.test.mjs'
      - 'client/src/pages/Opinioni*.tsx'
      - 'client/src/lib/saveAndVerifyOpinions.ts'
      - 'client/src/lib/opinionDelta.ts'
      - 'client/src/lib/encryptedOpinionCache.ts'
      - 'client/src/pages/Profilo/utils/encryptedProfileVault.ts'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/src/lib/logout-revocation.ts'
      - 'client/src/lib/native-push.ts'
      - 'client/tests/logoutRevocationConfirmation.test.mjs'
      - 'scripts/test-logout-revocation-browser.cjs'
      - 'client/src/pages/Impostazioni/hooks/useLogout.ts'
      - 'client/tests/authLogRedaction.test.mjs'
      - 'client/tests/opinionDelta.test.mjs'
      - 'client/src/components/PoliticalOpinionsConsentModal.tsx'
      - 'client/tests/politicalConsentGrantVaultBarrier.test.mjs'
      - 'client/tests/politicalOpinionHttpCancellation.test.mjs'
      - 'client/tests/politicalOpinionPrivacyIntegration.test.mjs'
      - 'client/tests/encryptedVaultPurgeRace.test.mjs'
      - 'client/tests/accountDeletionCachePurge.test.mjs'
      - 'client/tests/authInvalidationBarrier.test.mjs'
      - 'client/tests/privacyDisclosureIntegrity.test.mjs'
      - 'client/tests/dpiaReviewStatus.test.mjs'
      - 'docs/privacy/DPIA_RELEASE_RECONCILIATION_2026-10-30.md'
      - 'DPIA_DemosApp.md'
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/RegistroTrattamenti.tsx'
      - 'client/src/pages/Impostazioni/CancellaAccount/index.tsx'
      - 'client/src/pages/StatisticheOpinione/components/OpinionSelector.tsx'
      - 'client/src/lib/queryClient.ts'
      - 'client/src/pages/GDPR/index.tsx'
      - '.github/workflows/opinioni-regression.yml'

permissions:
  contents: read

jobs:
  opinioni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Test mobile crash diagnostic and toast opacity
        run: node --experimental-strip-types --test client/tests/crashDiagnostic.test.mjs client/tests/toastOpaque.test.mjs client/tests/opinionDelta.test.mjs client/tests/politicalOpinionHttpCancellation.test.mjs client/tests/politicalConsentGrantVaultBarrier.test.mjs client/tests/politicalOpinionPrivacyIntegration.test.mjs client/tests/encryptedVaultPurgeRace.test.mjs client/tests/accountDeletionCachePurge.test.mjs client/tests/authInvalidationBarrier.test.mjs client/tests/authLogRedaction.test.mjs client/tests/logoutRevocationConfirmation.test.mjs client/tests/privacyDisclosureIntegrity.test.mjs client/tests/dpiaReviewStatus.test.mjs
      - name: Build frontend
        run: npm --prefix client run build
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify opinion regressions and Android push logout contracts
        run: node --test --test-concurrency=1 api/tests/opinionStatsColumns.test.js api/tests/ordinaryUserOpinionSave.test.js api/tests/politicalOpinionWriteRules.smoke.test.js api/tests/opinionPrivacy.test.js api/tests/androidAuthNativePushIntegration.test.js api/tests/fcmTokenIntegrity.test.js

  logout-browser:
    name: Real browser logout regression (synthetic accounts)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install exact client dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Compile actual frontend
        run: npm run build --prefix client
      - name: Install isolated Chromium test runner
        run: |
          npm install --prefix /tmp/demos-logout-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node /tmp/demos-logout-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise account A logout and login B; confirmed, 503, 500, offline
        run: |
          npm run preview --prefix client -- --host localhost --port 4173 --strictPort > /tmp/demos-logout-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://localhost:4173/impostazioni >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4173/impostazioni >/dev/null
          NODE_PATH=/tmp/demos-logout-browser/node_modules node scripts/test-logout-revocation-browser.cjs
      - name: Save synthetic logout screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logout-browser-synthetic-failure
          path: /tmp/demos-logout-browser-*.png
          if-no-files-found: ignore
