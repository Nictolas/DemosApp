name: Opinioni regression

on:
  pull_request:
    paths:
      - 'api/routes/opinioni/**'
      - 'api/utils/opinionStatsColumns.js'
      - 'api/tests/opinionStatsColumns.test.js'
      - 'api/tests/ordinaryUserOpinionSave.test.js'
      - 'client/src/components/OpinionStatsBar.tsx'
      - 'client/src/components/ui/toast.tsx'
      - 'client/src/components/ui/toaster.tsx'
      - 'client/tests/toastOpaque.test.mjs'
      - 'client/src/components/ErrorBoundary.tsx'
      - 'client/src/lib/crashDiagnostic.ts'
      - 'client/tests/crashDiagnostic.test.mjs'
      - 'client/src/pages/Opinioni*.tsx'
      - 'client/src/lib/saveAndVerifyOpinions.ts'
      - '.github/workflows/opinioni-regression.yml'

permissions:
  contents: read

jobs:
  opinioni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Test mobile crash diagnostic and toast opacity
        run: node --experimental-strip-types --test client/tests/crashDiagnostic.test.mjs client/tests/toastOpaque.test.mjs
      - name: Verify real React Query cancellation of sensitive opinion requests
        run: node --experimental-strip-types --test client/tests/opinionQueryCancellation.test.mjs
      - name: Build frontend
        run: npm --prefix client run build
      - name: Install API dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify opinion regressions
        # Execute node:test in-process. Separate Node workers intermittently
        # fail to deserialize the runner's IPC messages (ERR_TEST_FAILURE).
        # This avoids false failures without suppressing test assertions.
        run: |
          set -euo pipefail
          for testfile in \
            api/tests/opinionStatsColumns.test.js \
            api/tests/ordinaryUserOpinionSave.test.js \
            api/tests/politicalOpinionWriteRules.smoke.test.js \
            api/tests/opinionPrivacy.test.js
          do
            node "$testfile"
          done
