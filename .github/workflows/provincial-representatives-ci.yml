name: Provincial representative canonical model — isolated tests
on:
  pull_request:
    paths:
      - 'api/config/politicalJurisdictions.js'
      - 'api/services/politicalEligibilityService.js'
      - 'api/services/politicalMatchingService.js'
      - 'api/services/politicalSelectionService.js'
      - 'api/services/politicalConsentService.js'
      - 'api/services/politicalJurisdictionRegistryService.js'
      - 'api/routes/rappresentanti.js'
      - 'api/routes/rappresentanti-sostenitori.js'
      - 'api/routes/sostenitori-totale.js'
      - 'api/routes/candidati.js'
      - 'api/routes/elezioni.js'
      - 'api/routes/users/profile.js'
      - 'api/tests/politicalJurisdictionRegistryService.test.js'
      - 'api/tests/politicalSelectionService.test.js'
      - 'api/tests/politicalSelectionRoute.test.js'
      - 'api/tests/politicalEligibilityService.test.js'
      - 'api/tests/politicalMatchingService.test.js'
      - 'api/tests/provincialMandateOfficeGuard.test.js'
      - 'api/tests/provincialCandidacyJurisdictionGuard.test.js'
      - 'api/tests/provincialRegionalDedup.test.js'
      - 'api/tests/provincialSupporters.http.test.js'
      - 'api/tests/provincialConsentErasure.test.js'
      - 'api/tests/provincialConsentWriteRace.http.test.js'
      - 'api/tests/provincialConsentOpinionRead.integration.test.js'
      - 'api/tests/provincialOpinionMatching.contract.test.js'
      - 'api/tests/provincialReadRelease.http.test.js'
      - 'api/tests/provincialFrontendWiring.smoke.test.js'
      - 'api/tests/provincialCandidateLogPrivacy.http.test.js'
      - 'api/tests/provincialRepresentativeLogPrivacy.test.js'
      - 'api/tests/provincialCrossPrCompatibility.integration.test.js'
      - 'client/src/lib/provincialSelection.ts'
      - 'client/src/components/ProvincialOfficeChoice.tsx'
      - 'client/src/components/ViewOpinioniDialog.tsx'
      - 'client/src/pages/SelectionGrid.css'
      - 'client/src/pages/Rappresentanti/index.tsx'
      - 'client/src/pages/Candidati/index.tsx'
      - 'client/src/pages/ScegliRappresentante/**'
      - '.github/workflows/provincial-representatives-ci.yml'
permissions:
  contents: read
jobs:
  provincial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Read-only checkout of Draft PR #624 opinion taxonomy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/opinion-topic-taxonomy-20261105
          path: .integration-refs/opinion-topics
          persist-credentials: false
          sparse-checkout: |
            client/src/lib/opinionProvincialIds.ts
            client/src/lib/opinionTopics.ts
          sparse-checkout-cone-mode: false
      - name: Read-only checkout of Draft PR #557 political consent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/p0-political-consent-read-main-20261102
          path: .integration-refs/political-consent
          persist-credentials: false
          sparse-checkout: |
            api/services/politicalMatchingService.js
            api/routes/users/profile.js
          sparse-checkout-cone-mode: false
      - name: Install API dependencies without scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate syntax
        run: |
          node --check api/config/politicalJurisdictions.js
          node --check api/services/politicalEligibilityService.js
          node --check api/services/politicalMatchingService.js
          node --check api/services/politicalSelectionService.js
          node --check api/services/politicalJurisdictionRegistryService.js
          node --check api/routes/users/profile.js
          node --check api/routes/rappresentanti.js
          node --check api/routes/rappresentanti-sostenitori.js
          node --check api/routes/sostenitori-totale.js
          node --check api/routes/candidati.js
          node --check api/routes/elezioni.js
      - name: Test territory, authority and canonical persistence (no database)
        run: |
          node --test --test-concurrency=1 \
            api/tests/politicalJurisdictionRegistryService.test.js \
            api/tests/politicalSelectionService.test.js \
            api/tests/politicalSelectionRoute.test.js \
            api/tests/politicalEligibilityService.test.js \
            api/tests/politicalMatchingService.test.js \
            api/tests/provincialMandateOfficeGuard.test.js \
            api/tests/provincialCandidacyJurisdictionGuard.test.js \
            api/tests/provincialRegionalDedup.test.js \
            api/tests/provincialSupporters.http.test.js \
            api/tests/provincialConsentErasure.test.js \
            api/tests/provincialConsentWriteRace.http.test.js \
            api/tests/provincialConsentOpinionRead.integration.test.js \
            api/tests/provincialOpinionMatching.contract.test.js \
            api/tests/provincialReadRelease.http.test.js \
            api/tests/provincialFrontendWiring.smoke.test.js \
            api/tests/provincialCandidateLogPrivacy.http.test.js \
            api/tests/provincialRepresentativeLogPrivacy.test.js
      - name: Test live Draft branch compatibility (read-only, no merge)
        run: |
          echo "Opinion taxonomy reference:"
          git -C .integration-refs/opinion-topics rev-parse HEAD
          echo "Consent reference:"
          git -C .integration-refs/political-consent rev-parse HEAD
          node --test api/tests/provincialCrossPrCompatibility.integration.test.js
