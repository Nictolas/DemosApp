name: Opinion catalog — Android emulator smoke (offline)
on:
  push:
    branches: [performance/opinion-catalog-in-code-20261028]
    paths:
      - 'api/catalog/**'
      - 'api/services/opinionCatalog.js'
      - 'api/routes/opinioni/**'
      - 'client/android/**'
      - 'client/src/**'
      - '.github/workflows/opinion-catalog-android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate (no persisted Git credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install client and sync Android assets
        run: |
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
          npm run android:sync --prefix client

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch DEMOS in isolated Android emulator (no network)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd client/android
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Archive Android instrumentation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demos-android-emulator-smoke-report
          path: |
            client/android/app/build/reports/androidTests/
            client/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
