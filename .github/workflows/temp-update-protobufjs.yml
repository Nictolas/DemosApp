name: Temporary protobufjs update

on:
  push:
    branches:
      - fix-protobufjs-security

permissions:
  contents: write

jobs:
  update-protobufjs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update protobufjs
        working-directory: api
        run: npm update protobufjs --package-lock-only --ignore-scripts
      - name: Verify
        working-directory: api
        run: |
          npm ci --ignore-scripts
          npm ls protobufjs
          npm audit --omit=dev || true
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna protobufjs a una versione corretta"
            git push origin HEAD:fix-protobufjs-security
          fi
