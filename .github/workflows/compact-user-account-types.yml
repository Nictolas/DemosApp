name: Compact user account types P O E

on:
  pull_request:
    paths:
      - 'api/services/accountCapabilitiesService.js'
      - 'api/routes/opinioni/stats.js'
      - 'api/utils/sondaggiTextBulk.js'
      - 'api/routes/organizzazioni.js'
      - 'api/routes/users/search.js'
      - 'api/database/users-role-default-e-20261029.sql'
      - 'api/database/users-account-type-poe-20261029.sql'
      - 'api/tests/shortAccountTypeCodes.test.js'
      - 'api/tests/shortAccountTypeMigration.integration.sh'
      - '.github/workflows/compact-user-account-types.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-account-types:
    name: P O E contracts and PostgreSQL 17 migration (synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Account-type semantics and legacy role regression
        run: |
          node --test api/tests/shortAccountTypeCodes.test.js api/tests/accountCapabilitiesService.test.js
      - name: PostgreSQL 17 isolated migration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          bash api/tests/shortAccountTypeMigration.integration.sh
