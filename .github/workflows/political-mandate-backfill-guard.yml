name: Political mandate backfill integrity

on:
  pull_request:
    paths:
      - "api/database/create-account-capabilities-model.sql"
      - "api/tests/accountCapabilitiesMigration.test.js"
      - "api/tests/unverifiedMandateGuard.integration.sh"
      - ".github/workflows/political-mandate-backfill-guard.yml"
  push:
    branches:
      - "fix/prevent-unverified-mandate-backfill-20261028"
    paths:
      - "api/database/create-account-capabilities-model.sql"
      - "api/tests/accountCapabilitiesMigration.test.js"
      - "api/tests/unverifiedMandateGuard.integration.sh"
      - ".github/workflows/political-mandate-backfill-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mandate-backfill-integrity:
    name: Reject unverified legacy ACTIVE mandate backfills
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate fail-closed capability migration
        run: node --test api/tests/accountCapabilitiesMigration.test.js

      - name: PostgreSQL 17 integration guard scenarios (synthetic data)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          bash api/tests/unverifiedMandateGuard.integration.sh
