name: Security Agent Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/security-agent/**'
      - 'api/tests/security*.test.js'
      - 'api/tests/firebaseAdminCompatibility.test.js'
      - 'api/tests/civicProcessMultiSourcePersistence.test.js'
      - 'api/tests/italianPopularInitiativesMultiSource.test.js'
      - 'api/tests/italyOfficialGazetteReferendumAdapter.test.js'
      - 'api/tests/italyInteriorEligendoReferendumAdapter.test.js'
      - 'api/tests/referendumGazetteLifecycleService.test.js'
      - 'api/tests/referendumGazetteReindictionService.test.js'
      - 'api/tests/referendumRealVote.smoke.test.js'
      - 'api/tests/referendumForecastStats.test.js'
      - 'api/tests/politicalMatchingRepresentativesRoutes.smoke.test.js'
      - 'api/services/politicalEligibilityService.js'
      - 'api/services/civicSources/italyCameraPopularInitiativesAdapter.js'
      - 'api/services/italianPopularInitiativesParliamentSyncService.js'
      - 'api/services/civicSources/italyOfficialGazetteReferendumAdapter.js'
      - 'api/services/civicSources/italyInteriorEligendoReferendumAdapter.js'
      - 'api/services/italianReferendumOfficialSyncService.js'
      - 'api/services/italianReferendumResultSyncService.js'
      - 'api/services/referendumGazetteLifecycleService.js'
      - 'api/services/referendumGazetteReindictionService.js'
      - 'api/services/referendumBallotSyncService.js'
      - 'api/services/referendumForecastStatsService.js'
      - 'api/services/referendumForecastSnapshotService.js'
      - 'api/jobs/referendumForecastSnapshotJob.js'
      - 'api/jobs/civicProcessSyncJob.js'
      - 'api/routes/referendum-vote.js'
      - '20261017_referendum_forecast_snapshots.sql'
      - 'api/app.js'
      - 'api/middleware/rateLimiting.js'
      - 'api/services/accessRevocationService.js'
      - 'api/services/firebaseAdmin.js'
      - 'scripts/security-*.js'
      - 'client/**'
      - 'package*.json'
      - 'api/package*.json'
      - 'client/package*.json'
      - '.github/workflows/security-agent-validation.yml'
  push:
    branches:
      - security/agent-foundation-v0
    paths:
      - 'api/security-agent/**'
      - 'api/tests/security*.test.js'
      - 'api/tests/firebaseAdminCompatibility.test.js'
      - 'api/tests/civicProcessMultiSourcePersistence.test.js'
      - 'api/tests/italianPopularInitiativesMultiSource.test.js'
      - 'api/tests/italyOfficialGazetteReferendumAdapter.test.js'
      - 'api/tests/italyInteriorEligendoReferendumAdapter.test.js'
      - 'api/tests/referendumGazetteLifecycleService.test.js'
      - 'api/tests/referendumGazetteReindictionService.test.js'
      - 'api/tests/referendumRealVote.smoke.test.js'
      - 'api/tests/referendumForecastStats.test.js'
      - 'api/tests/politicalMatchingRepresentativesRoutes.smoke.test.js'
      - 'api/services/politicalEligibilityService.js'
      - 'api/services/civicSources/italyCameraPopularInitiativesAdapter.js'
      - 'api/services/italianPopularInitiativesParliamentSyncService.js'
      - 'api/services/civicSources/italyOfficialGazetteReferendumAdapter.js'
      - 'api/services/civicSources/italyInteriorEligendoReferendumAdapter.js'
      - 'api/services/italianReferendumOfficialSyncService.js'
      - 'api/services/italianReferendumResultSyncService.js'
      - 'api/services/referendumGazetteLifecycleService.js'
      - 'api/services/referendumGazetteReindictionService.js'
      - 'api/services/referendumBallotSyncService.js'
      - 'api/services/referendumForecastStatsService.js'
      - 'api/services/referendumForecastSnapshotService.js'
      - 'api/jobs/referendumForecastSnapshotJob.js'
      - 'api/jobs/civicProcessSyncJob.js'
      - 'api/routes/referendum-vote.js'
      - '20261017_referendum_forecast_snapshots.sql'
      - 'api/app.js'
      - 'api/middleware/rateLimiting.js'
      - 'api/services/accessRevocationService.js'
      - 'api/services/firebaseAdmin.js'
      - 'scripts/security-*.js'
      - 'client/**'
      - 'package*.json'
      - 'api/package*.json'
      - 'client/package*.json'
      - '.github/workflows/security-agent-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install API dependencies
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Dependency audit API
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit client
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Political representative eligibility
        run: node api/tests/politicalMatchingRepresentativesRoutes.smoke.test.js

      - name: PWA legacy cache retirement
        run: node --test api/tests/pwaServiceWorkerRetirement.smoke.test.js

      - name: Popular initiatives civic sources
        run: node --test api/tests/civicProcessMultiSourcePersistence.test.js api/tests/italianPopularInitiativesMultiSource.test.js

      - name: Official referendum sources and forecast statistics
        run: node --test api/tests/italyOfficialGazetteReferendumAdapter.test.js api/tests/italyInteriorEligendoReferendumAdapter.test.js api/tests/referendumGazetteLifecycleService.test.js api/tests/referendumGazetteReindictionService.test.js api/tests/referendumForecastStats.test.js api/tests/referendumRealVote.smoke.test.js

      - name: Phase 2 CI staging evidence (RT01-RT06)
        run: npm run test:security-phase2-staging

      - name: Phase 5 Action Runner sandbox (RT10)
        run: node --test api/tests/securityActionRunnerSandbox.test.js

      - name: Phase 5 first four reversible playbooks
        run: node --test api/tests/securityPhase5FirstFourPlaybooks.test.js

      - name: Phase 7 L3 approval-bound control-plane pre-gate
        run: node --test api/tests/securityPhase7L3ApprovalControlPlane.test.js

      - name: Phase 7 P07 deploy rollback dry-run planner
        run: node --test api/tests/securityPhase7P07DeployRollbackPlanner.test.js

      - name: Phase 7 P07 Render dry-run binding contract
        run: node --test api/tests/securityPhase7P07RenderDryRunContract.test.js

      - name: Security pre-CI gate
        run: npm run test:security-preci
