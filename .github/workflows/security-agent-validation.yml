name: Security Agent Validation

on:
  push:
    branches:
      - security/agent-foundation-v0
    paths:
      - 'api/security-agent/**'
      - 'api/tests/security*.test.js'
      - 'scripts/security-*.js'
      - 'client/**'
      - 'package*.json'
      - 'api/package*.json'
      - 'client/package*.json'
      - '.github/workflows/security-agent-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install API dependencies
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Dependency audit API
        working-directory: api
        run: npm audit --audit-level=high

      - name: Dependency audit client
        working-directory: client
        run: npm audit --audit-level=high

      - name: Security pre-CI gate
        run: npm run test:security-preci

