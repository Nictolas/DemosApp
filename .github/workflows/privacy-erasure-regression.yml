name: Privacy erasure regression
on:
  pull_request:
    paths:
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/services/dataRetentionService.js'
      - 'api/routes/admin/data-retention.js'
      - 'api/jobs/dataRetentionJob.js'
      - 'api/app.js'
      - 'api/middleware/auth.js'
      - 'api/services/rateLimitService.js'
      - 'api/routes/admin/validation.js'
      - 'api/routes/admin/rate-limiting.js'
      - 'api/routes/admin/monitoring.js'
      - 'api/routes/admin/logging.js'
      - 'api/services/performanceMonitor.js'
      - 'api/services/healthCheckService.js'
      - 'api/services/centralizedLogger.js'
      - 'client/src/pages/DataRetention.tsx'
      - 'api/tests/legacyAdminCleanup.smoke.test.js'
      - 'api/tests/accountDeletion.integration.test.js'
      - 'api/routes/admin/audit-dashboard.js'
      - 'api/tests/auditCleanupFailClosed.test.js'
      - 'api/tests/accountDeletionProductionShape.pg17.test.js'
      - 'api/tests/legacyLinkedRows.integration.test.js'
      - '.github/workflows/privacy-erasure-regression.yml'
jobs:
  account-erasure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: privacy_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic_only@localhost:5432/privacy_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix api --ignore-scripts
      - name: Test canonical account erasure with synthetic users
        run: node --test api/tests/legacyAdminCleanup.smoke.test.js api/tests/accountDeletion.integration.test.js
      - name: Verify audit retention cleanup fails closed (synthetic, no provider)
        run: node --test api/tests/auditCleanupFailClosed.test.js
      - name: Verify legacy linked rows and foreign keys
        run: node --test api/tests/legacyLinkedRows.integration.test.js
      - name: Verify UUID production-shaped FK and GDPR erasure (synthetic PG17)
        run: node --test api/tests/accountDeletionProductionShape.pg17.test.js
