name: Temporary npm security audit

on:
  push:
    branches:
      - audit-high-vulnerabilities

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm install
      - name: Smoke test Puppeteer browser
        run: |
          node - <<'NODE'
          (async () => {
            const puppeteer = require('puppeteer');
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0');
            await page.setContent('<html><body>puppeteer-ok</body></html>');
            const html = await page.content();
            await browser.close();
            if (!html.includes('puppeteer-ok')) throw new Error('Smoke test fallito');
            console.log('Puppeteer browser OK');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
      - name: Smoke test Firebase Admin legacy API and Firestore
        run: |
          node - <<'NODE'
          (async () => {
            const admin = require('firebase-admin');
            if (!Array.isArray(admin.apps)) throw new Error('admin.apps non disponibile');
            if (!admin.credential || typeof admin.credential.cert !== 'function') throw new Error('admin.credential.cert non disponibile');
            if (typeof admin.initializeApp !== 'function') throw new Error('admin.initializeApp non disponibile');
            if (typeof admin.messaging !== 'function') throw new Error('admin.messaging non disponibile');
            if (typeof admin.firestore !== 'function') throw new Error('admin.firestore non disponibile');
            const app = admin.initializeApp({ projectId: 'demos-smoke-test' }, 'security-smoke');
            const messaging = admin.messaging(app);
            if (!messaging || typeof messaging.send !== 'function') throw new Error('Firebase Messaging non disponibile');
            const firestore = admin.firestore(app);
            if (!firestore || typeof firestore.collection !== 'function') throw new Error('Firestore non disponibile');
            await app.delete();
            console.log('Firebase Admin legacy API + Firestore OK');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
      - name: Smoke test node-cron API
        run: |
          node - <<'NODE'
          const cron = require('node-cron');
          if (typeof cron.schedule !== 'function' || typeof cron.validate !== 'function') throw new Error('node-cron API non compatibile');
          if (!cron.validate('0 2 * * *')) throw new Error('Validazione cron fallita');
          const task = cron.schedule('0 2 * * *', () => {}, { scheduled: false });
          if (!task || typeof task.start !== 'function' || typeof task.stop !== 'function') throw new Error('Task node-cron non compatibile');
          task.start();
          task.stop();
          console.log('node-cron API OK');
          NODE
      - name: Smoke test gaxios API
        run: |
          node - <<'NODE'
          const { Gaxios } = require('gaxios');
          const client = new Gaxios();
          if (!client || typeof client.request !== 'function') throw new Error('gaxios API non compatibile');
          console.log('gaxios API OK');
          NODE
      - name: Smoke test fast-xml-parser API if installed
        run: |
          node - <<'NODE'
          try {
            require.resolve('fast-xml-parser');
          } catch {
            console.log('fast-xml-parser non installato direttamente: test non necessario');
            process.exit(0);
          }
          const { XMLParser, XMLBuilder } = require('fast-xml-parser');
          const parser = new XMLParser();
          const parsed = parser.parse('<root><value>ok</value></root>');
          if (!parsed || parsed.root.value !== 'ok') throw new Error('XMLParser non compatibile');
          const builder = new XMLBuilder();
          const xml = builder.build({ root: { value: 'ok' } });
          if (!xml.includes('<value>ok</value>')) throw new Error('XMLBuilder non compatibile');
          console.log('fast-xml-parser API OK');
          NODE
      - name: npm audit JSON
        run: npm audit --json || true
