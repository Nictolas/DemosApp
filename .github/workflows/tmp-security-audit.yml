name: Temporary npm security audit

on:
  push:
    branches:
      - audit-high-vulnerabilities

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies safely
        run: npm install --ignore-scripts
      - name: Smoke test Puppeteer API
        run: node -e "const p=require('puppeteer'); if(typeof p.launch!=='function') process.exit(1); console.log('Puppeteer API OK')"
      - name: npm audit JSON
        run: npm audit --json || true
