name: Temporary npm security audit

on:
  push:
    branches:
      - audit-high-vulnerabilities

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm install
      - name: Smoke test Puppeteer browser
        run: |
          node - <<'NODE'
          (async () => {
            const puppeteer = require('puppeteer');
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0');
            await page.setContent('<html><body>puppeteer-ok</body></html>');
            const html = await page.content();
            await browser.close();
            if (!html.includes('puppeteer-ok')) throw new Error('Smoke test fallito');
            console.log('Puppeteer browser OK');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
      - name: Smoke test Firebase Admin legacy API
        run: |
          node - <<'NODE'
          (async () => {
            const admin = require('firebase-admin');
            if (!Array.isArray(admin.apps)) throw new Error('admin.apps non disponibile');
            if (!admin.credential || typeof admin.credential.cert !== 'function') throw new Error('admin.credential.cert non disponibile');
            if (typeof admin.initializeApp !== 'function') throw new Error('admin.initializeApp non disponibile');
            if (typeof admin.messaging !== 'function') throw new Error('admin.messaging non disponibile');
            const app = admin.initializeApp({ projectId: 'demos-smoke-test' }, 'security-smoke');
            const messaging = admin.messaging(app);
            if (!messaging || typeof messaging.send !== 'function') throw new Error('Firebase Messaging non disponibile');
            await app.delete();
            console.log('Firebase Admin legacy API OK');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
      - name: Smoke test node-cron API
        run: |
          node - <<'NODE'
          const cron = require('node-cron');
          if (typeof cron.schedule !== 'function' || typeof cron.validate !== 'function') throw new Error('node-cron API non compatibile');
          if (!cron.validate('0 2 * * *')) throw new Error('Validazione cron fallita');
          const task = cron.schedule('0 2 * * *', () => {}, { scheduled: false });
          if (!task || typeof task.start !== 'function' || typeof task.stop !== 'function') throw new Error('Task node-cron non compatibile');
          task.start();
          task.stop();
          console.log('node-cron API OK');
          NODE
      - name: Smoke test gaxios API
        run: |
          node - <<'NODE'
          const { Gaxios } = require('gaxios');
          const client = new Gaxios();
          if (!client || typeof client.request !== 'function') throw new Error('gaxios API non compatibile');
          console.log('gaxios API OK');
          NODE
      - name: Smoke test SimpleWebAuthn 14 API
        run: |
          node - <<'NODE'
          (async () => {
            const sw = require('@simplewebauthn/server');
            for (const name of ['generateRegistrationOptions', 'verifyRegistrationResponse', 'generateAuthenticationOptions', 'verifyAuthenticationResponse']) {
              if (typeof sw[name] !== 'function') throw new Error(`${name} non disponibile`);
            }
            const reg = await sw.generateRegistrationOptions({
              rpID: 'demos.community',
              rpName: 'Demos',
              userID: Buffer.from('security-smoke-user', 'utf8'),
              userName: 'security-smoke-user',
              userDisplayName: 'Security smoke',
              authenticatorSelection: {
                residentKey: 'preferred',
                userVerification: 'discouraged',
                authenticatorAttachment: 'platform'
              },
              attestationType: 'none'
            });
            if (!reg || typeof reg.challenge !== 'string' || !reg.user || typeof reg.user.id !== 'string') {
              throw new Error('generateRegistrationOptions non compatibile');
            }
            const auth = await sw.generateAuthenticationOptions({
              rpID: 'demos.community',
              allowCredentials: [],
              userVerification: 'preferred'
            });
            if (!auth || typeof auth.challenge !== 'string') throw new Error('generateAuthenticationOptions non compatibile');
            console.log('SimpleWebAuthn 14 generazione options OK');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
      - name: Smoke test fast-xml-parser API if installed
        run: |
          node - <<'NODE'
          try {
            require.resolve('fast-xml-parser');
          } catch {
            console.log('fast-xml-parser non installato direttamente: test non necessario');
            process.exit(0);
          }
          const { XMLParser, XMLBuilder } = require('fast-xml-parser');
          const parser = new XMLParser();
          const parsed = parser.parse('<root><value>ok</value></root>');
          if (!parsed || parsed.root.value !== 'ok') throw new Error('XMLParser non compatibile');
          const builder = new XMLBuilder();
          const xml = builder.build({ root: { value: 'ok' } });
          if (!xml.includes('<value>ok</value>')) throw new Error('XMLBuilder non compatibile');
          console.log('fast-xml-parser API OK');
          NODE
      - name: npm audit JSON
        run: npm audit --json || true
      - name: Check Demos WebAuthn code migration for v14
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('routes/auth/webauthn.js', 'utf8');
          const problems = [];
          if (source.includes('authenticator: {')) {
            problems.push('verifyAuthenticationResponse usa ancora authenticator invece di credential');
          }
          if (source.includes('credentialPublicKey, credentialID, counter')) {
            problems.push('registrationInfo usa ancora i campi v10 invece di registrationInfo.credential');
          }
          if (problems.length) {
            throw new Error('Migrazione WebAuthn necessaria: ' + problems.join('; '));
          }
          console.log('Codice Demos compatibile con SimpleWebAuthn v14');
          NODE
      - name: Syntax check WebAuthn route
        run: node --check routes/auth/webauthn.js
