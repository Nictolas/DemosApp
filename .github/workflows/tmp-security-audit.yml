name: Temporary npm security audit

on:
  push:
    branches:
      - audit-high-vulnerabilities

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve lockfile safely
        run: npm install --package-lock-only --ignore-scripts
      - name: npm audit JSON
        run: npm audit --json || true
