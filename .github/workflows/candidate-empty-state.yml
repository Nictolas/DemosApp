name: Candidate empty state regression

on:
  pull_request:
    paths:
      - 'client/src/pages/ScegliRappresentante/**'
      - 'api/tests/retiredMenuNavigation.smoke.test.js'
      - '.github/workflows/candidate-empty-state.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/pages/ScegliRappresentante/**'
      - 'api/tests/retiredMenuNavigation.smoke.test.js'
      - '.github/workflows/candidate-empty-state.yml'

jobs:
  candidate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Candidate and navigation regression
        run: node --test api/tests/retiredMenuNavigation.smoke.test.js
      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build web frontend
        run: npm run build --prefix client
