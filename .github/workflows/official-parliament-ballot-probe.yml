name: Official Parliament Ballot Source Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/scripts/probeOfficialFinalBallots.js'
      - '.github/workflows/official-parliament-ballot-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Official source structure and nominal voting records
        run: node api/scripts/probeOfficialFinalBallots.js
