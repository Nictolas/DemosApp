name: Official Parliament Ballot Source Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/scripts/probeOfficialFinalBallots.js'
      - 'api/scripts/checkVerifiedFinalBallots.js'
      - 'api/services/parliamentVerifiedFinalBallotsService.js'
      - 'api/routes/voti-politici.js'
      - 'client/src/pages/VotiPoliticiFinali.tsx'
      - '.github/workflows/official-parliament-ballot-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verified roll-call parser and API syntax
        run: |
          node --check api/services/parliamentVerifiedFinalBallotsService.js
          node --check api/routes/voti-politici.js
          node --check api/scripts/checkVerifiedFinalBallots.js
      - name: Live official Camera and Openpolis Senate roll-call smoke
        run: node api/scripts/checkVerifiedFinalBallots.js
      - name: Frontend build
        run: |
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
          npm run build --prefix client

