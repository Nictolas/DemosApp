      - '.github/workflows/gdpr-b2-worker-retry-isolated-ci.yml'

permissions:
  contents: read

jobs:
  b2-worker-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: gdpr_outbox_worker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gdpr_outbox_worker_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install synthetic-only dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Inspect existing functional staging branch SOURCE ONLY (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --no-tags --depth=1 origin \
            '+refs/heads/staging/functional-integration-v0:refs/remotes/origin/gdpr-audit-functional-staging'
          node api/tests/gdprStagingBootSourceAudit.test.js
      - name: Verify manual worker syntax, retries, receipt binding and rollback
        env:
          GITHUB_ACTIONS: 'true'
          GDPR_OUTBOX_WORKER_CI: isolated
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_outbox_worker_ci
        run: |
          node --check api/services/privacyErasureOutboxWorker.js
          node --check api/services/privacyErasureB2Journal.js
          node --test --test-concurrency=1 api/tests/gdprB2JournalVersionBindingIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2BucketComplianceDeadlineIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2ArchiveHeadPutDeadlineIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2RealWorkerFailClosedSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprLedgerArchiveFormatNoOutboxIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprLedgerCapturedArchivePreflightIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2InventoryReconciliationIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2WorkerInjectedExporterNoGoIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2DirectWriteGateIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2WrappedTransportNoGoIsolated.test.js
          node --test --test-concurrency=1 api/tests/gdprB2DurablePutClaimPg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprB2CursorGapPg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprB2StaleSqlWitnessGateSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprB2WitnessSingleUseReservationSynthetic.test.js
          node --check api/tests/fixtures/gdprB2MonotonicAnchorSynthetic.js
          node --test --test-concurrency=1 api/tests/gdprB2MonotonicAnchorSynthetic.test.js
          node --check api/tests/fixtures/gdprB2DiskReservationSynthetic.js
          node --test --test-concurrency=1 api/tests/gdprB2DiskReservationSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprB2JournalBoundedReadbackIsolated.test.js
          node --check api/scripts/attest-gdpr-b2-bucket-readonly.js
          node --test --test-concurrency=1 api/tests/gdprB2ReadonlyBucketMetadata.test.js
          node --check api/scripts/attest-gdpr-b2-synthetic-version-readonly.js
          node --test --test-concurrency=1 api/tests/gdprB2SyntheticVersionReadonly.test.js
          node --check api/tests/fixtures/gdprB2VersionInventorySynthetic.js
          node --test --test-concurrency=1 api/tests/gdprB2VersionInventorySynthetic.test.js
          node --check api/tests/fixtures/gdprB2S3VersionPaginationSynthetic.js
          node --test --test-concurrency=1 api/tests/gdprB2S3VersionPaginationSynthetic.test.js
          node --check api/tests/fixtures/gdprB2IndependentVersionPinsSynthetic.js
          node --test --test-concurrency=1 api/tests/gdprB2IndependentVersionPinsSynthetic.test.js
          node --check api/tests/fixtures/gdprB2VersionRetentionSynthetic.js
          node --test --test-concurrency=1 api/tests/gdprB2VersionRetentionSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDataPlaneRouteSurface.test.js
          node api/tests/gdprLegacyAdminSchemaMutationRouteIsolated.test.js
          node api/tests/gdprPrivacyCanonicalPoolIsolated.test.js
          # Run node:test in-process to avoid intermittent Node 22 child-runner IPC deserialization.
          node api/tests/gdprLegacyHealthDbDiagnosticIsolated.test.js
          node --check api/tests/fixtures/gdprDurableRecoveryPrototype.js
          node --test --test-concurrency=1 api/tests/gdprDurableRecoveryProtocolSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprRecoveryConcurrencySynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprWitnessAckCrashGapSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDurableRecoveryPg17Synthetic.test.js
          node --check api/tests/gdprRecoverySnapshotAtomicCutPg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprRecoverySnapshotAtomicCutPg17Synthetic.test.js
          node --check api/tests/gdprRecoveryCrossConnectionSnapshotPg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprRecoveryCrossConnectionSnapshotPg17Synthetic.test.js
          node --check api/tests/fixtures/gdprCrossPlaneRecoveryCutSynthetic.js
          node --test --test-concurrency=1 api/tests/gdprCrossPlaneRecoveryCutSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDistributedFencePg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDualPlaneQuarantinePg17Synthetic.test.js
          node --check api/tests/gdprPrivilegedWriterBypassPg17Synthetic.test.js
          node api/tests/gdprPrivilegedWriterBypassPg17Synthetic.test.js
          node --check api/tests/gdprDefaultPrivilegeExposurePg17Synthetic.test.js
          node api/tests/gdprDefaultPrivilegeExposurePg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprIndependentAdmissionEpochSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprCommitAdmissionLeaseSynthetic.test.js
          node --check api/scripts/attest-gdpr-writer-readonly.js
          node --test --test-concurrency=1 api/tests/gdprWriterReadonlyAttestation.test.js
          node api/tests/gdprRenderInProcessStagingAttestation.test.js
          node --check api/scripts/attest-gdpr-render-staging-isolated.js
          node api/tests/gdprRenderIsolatedStagingCli.test.js
          node --check api/tests/gdprOutboxWorkerIsolated.pg17.test.js
          node --test --test-concurrency=1 api/tests/gdprOutboxWorkerIsolated.pg17.test.js
          node --check api/tests/gdprBackendPoolIsolated.pg17.test.js
          # Execute node:test in-process: preserves TAP/exit-code assertions while
          # avoiding intermittent Node 22 child-runner IPC deserialization failures.
          GDPR_BACKEND_POOL_CI=isolated node api/tests/gdprBackendPoolIsolated.pg17.test.js
