name: GDPR B2 outbox worker retry and receipt regression (synthetic PG17)

on:
  pull_request:
    paths:
      - 'api/services/privacyErasureOutboxWorker.js'
      - 'api/app.js'
      - 'api/routes/database.js'
      - 'api/routes/cleanup.js'
      - 'api/routes/migrations.js'
      - 'api/routes/categorie.js'
      - 'api/config/db.js'
      - 'api/tests/gdprDataPlaneRouteSurface.test.js'
      - 'api/scripts/attest-gdpr-writer-readonly.js'
      - 'api/tests/gdprWriterReadonlyAttestation.test.js'
      - 'api/services/privacyErasureB2Journal.js'
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/tests/gdprOutboxWorkerIsolated.pg17.test.js'
      - 'api/tests/fixtures/gdprDurableRecoveryPrototype.js'
      - 'api/tests/gdprDurableRecoveryProtocolSynthetic.test.js'
      - 'api/tests/gdprRecoveryConcurrencySynthetic.test.js'
      - 'api/tests/gdprDurableRecoveryPg17Synthetic.test.js'
      - 'api/tests/gdprDistributedFencePg17Synthetic.test.js'
      - 'api/tests/gdprDualPlaneQuarantinePg17Synthetic.test.js'
      - 'api/tests/fixtures/gdprIndependentAdmissionEpochSynthetic.js'
      - 'api/tests/gdprIndependentAdmissionEpochSynthetic.test.js'
      - 'api/tests/fixtures/gdprCommitAdmissionLeaseSynthetic.js'
      - 'api/tests/gdprCommitAdmissionLeaseSynthetic.test.js'
      - 'api/tests/gdprBackendPoolIsolated.pg17.test.js'
      - 'api/config/database.js'
      - 'api/utils/databaseTlsPolicy.js'
      - '.github/workflows/gdpr-b2-worker-retry-isolated-ci.yml'

permissions:
  contents: read

jobs:
  b2-worker-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: gdpr_outbox_worker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gdpr_outbox_worker_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install synthetic-only dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify manual worker syntax, retries, receipt binding and rollback
        env:
          GITHUB_ACTIONS: 'true'
          GDPR_OUTBOX_WORKER_CI: isolated
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_outbox_worker_ci
        run: |
          node --check api/services/privacyErasureOutboxWorker.js
          node --test --test-concurrency=1 api/tests/gdprDataPlaneRouteSurface.test.js
          node --check api/tests/fixtures/gdprDurableRecoveryPrototype.js
          node --test --test-concurrency=1 api/tests/gdprDurableRecoveryProtocolSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprRecoveryConcurrencySynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDurableRecoveryPg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDistributedFencePg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprDualPlaneQuarantinePg17Synthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprIndependentAdmissionEpochSynthetic.test.js
          node --test --test-concurrency=1 api/tests/gdprCommitAdmissionLeaseSynthetic.test.js
          node --check api/scripts/attest-gdpr-writer-readonly.js
          node --test --test-concurrency=1 api/tests/gdprWriterReadonlyAttestation.test.js
          node --check api/tests/gdprOutboxWorkerIsolated.pg17.test.js
          node --test --test-concurrency=1 api/tests/gdprOutboxWorkerIsolated.pg17.test.js
          node --check api/tests/gdprBackendPoolIsolated.pg17.test.js
          # Execute node:test in-process: preserves TAP/exit-code assertions while
          # avoiding intermittent Node 22 child-runner IPC deserialization failures.
          GDPR_BACKEND_POOL_CI=isolated node api/tests/gdprBackendPoolIsolated.pg17.test.js
