name: European Parliament official latest-vote source validation

on:
  pull_request:
    paths:
      - 'api/services/europeanParliamentVerifiedRollCallReader.js'
      - 'api/tests/europeanParliamentVerifiedRollCallReader.test.js'
      - 'api/tests/europeanParliamentOfficialDecisionReader.test.js'
      - 'api/services/europeanParliamentOfficialDecisionReader.js'
      - 'api/services/europeanRepresentativeCurrentVoteReader.js'
      - 'api/services/europeanParliamentOfficialDiscovery.js'
      - 'api/tests/europeanParliamentOfficialDiscovery.test.js api/tests/europeanParliamentCurrentOnlyCandidateBridge.test.js'
      - 'api/tests/europeanRepresentativeCurrentVoteReader.test.js'
      - 'api/services/europeanParliamentCurrentOnlyCandidateBridge.js'
      - 'api/tests/europeanParliamentCurrentOnlyCandidateBridge.test.js'
      - 'api/tests/europeanRepresentativeChrome.synthetic.e2e.test.js'
      - 'client/src/pages/Rappresentanti/hooks/useRappresentantiData.ts'
      - 'client/src/pages/Rappresentanti/components/RappresentanteCard.tsx'
      - 'api/routes/rappresentanti.js'
      - 'api/scripts/verifyEuropeanParliamentOfficialDecisionAPI.js'
      - 'api/scripts/probeEuropeanParliamentOfficialRollCall.js'
      - 'api/scripts/probeEuropeanParliamentPublicApi.js'
      - 'api/scripts/probeEuropeanParliamentDiscovery.js'
      - 'api/scripts/verifyEuropeanParliamentLatestSitting.js'
      - 'api/scripts/probeEuropeanParliamentRecentCoverage.js'
      - 'client/src/pages/VotiParlamentoEuropeo.tsx'
      - 'api/routes/voti-parlamento-europeo.js'
      - 'client/src/components/ViewOpinioniDialog.tsx'
      - 'client/src/pages/Rappresentanti/index.tsx'
      - '.github/workflows/european-parliament-verified-rollcall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ep-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies without scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Strict official identifier/source/absence/order/cache contracts
        run: |
          node --check api/services/europeanParliamentVerifiedRollCallReader.js
          node --check api/services/europeanParliamentOfficialDecisionReader.js
          node --check api/routes/voti-parlamento-europeo.js
          node --check api/routes/rappresentanti.js
          node --check api/services/europeanRepresentativeCurrentVoteReader.js
          node --check api/services/europeanParliamentOfficialDiscovery.js
          node --check api/services/europeanParliamentCurrentOnlyCandidateBridge.js
          node --check api/scripts/verifyEuropeanParliamentLatestSitting.js
          node --check api/scripts/probeEuropeanParliamentRecentCoverage.js
          node --test api/tests/europeanParliamentVerifiedRollCallReader.test.js api/tests/europeanParliamentOfficialDecisionReader.test.js api/tests/europeanRepresentativeCurrentVoteReader.test.js api/tests/europeanParliamentOfficialDiscovery.test.js
      - name: Frontend type/build regression
        run: |
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
          npm run build --prefix client
      # One-off 8-sitting read-only source coverage was verified in run
      # 42511232120 (76/76). Keep external API calls as a MANUAL release gate
      # rather than a permanent requirement of each Draft PR push.
      - name: Complete Italian MEP latest verified whole-text ballots (manual release gate)
        if: github.event_name == 'workflow_dispatch'
        run: node api/scripts/verifyEuropeanParliamentLatestSitting.js

  ep-chrome-320-390:
    name: European representative current vote — real Chrome mobile synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install UI dependencies without scripts
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Install isolated Playwright against preinstalled Google Chrome
        run: |
          command -v google-chrome
          mkdir -p /tmp/demos-ep-chrome
          npm install --prefix /tmp/demos-ep-chrome --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Real Chrome 320x568 and 390x844 verified/fail-closed representative card
        env:
          DEMOS_PLAYWRIGHT_MODULE: /tmp/demos-ep-chrome/node_modules/playwright
          CI: 'true'
        run: node --test api/tests/europeanRepresentativeChrome.synthetic.e2e.test.js
