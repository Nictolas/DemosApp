name: Temporary Passkey frontend removal check

on:
  push:
    branches:
      - remove-passkey-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install client dependencies
        working-directory: client
        run: npm install
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Verify executable Passkey frontend removed
        run: |
          test ! -e client/src/lib/webauthn.ts
          test ! -e client/src/pages/registrazione-passkey.tsx
          if grep -R -n -E '@/lib/webauthn|registerWithPasskey|loginWithPasskey|isWebAuthnSupported' client/src; then
            echo "Riferimenti WebAuthn eseguibili ancora presenti nel frontend"
            exit 1
          fi
          grep -q '/auth/oauth/complete-registration' client/src/pages/registrazione-completa-oauth.tsx
          echo "Executable Passkey frontend removal OK"
      - name: Report legacy Passkey-named references still present
        run: |
          echo '--- legacy references ---'
          grep -R -n -E 'registrazione_passkey_flow|webauthn_user_id|registrazione-crea-passkey' client/src || true
