name: Versioned opinion catalog — contracts and frontend build
on:
  push:
    branches: [performance/opinion-catalog-in-code-20261028, integration/opinioni-catalog-privacy-20261029]
  pull_request:
    paths:
      - 'api/catalog/**'
      - 'api/services/opinionCatalog.js'
      - 'api/routes/**'
      - 'api/services/**'
      - 'api/app.js' # API origin policy/global error changes must satisfy required catalog-contract
      - 'api/tests/opinionCatalog*.test.js'
      - 'api/tests/opinionTopics.contract.test.js'
      - 'api/tests/opinionTopicsBrowser.e2e.test.js'
      - 'api/tests/opinionTopicsAccountIsolation.e2e.test.js'
      - 'api/qa/opinionCatalogQaServer.js'
      - 'client/src/lib/opinionTopics.ts'
      - 'client/src/lib/opinionProvincialIds.ts'
      - 'client/src/lib/opinionTopicProgress.ts'
      - 'client/src/components/OpinioniTopicsMenu.tsx'
      - 'client/tests/opinionTopicProgress.test.mjs'
      - 'client/tests/opinionTopicDrafts.test.mjs'
      - 'client/src/lib/opinionTopicDrafts.ts'
      - 'client/src/pages/Opinioni*.tsx'
      - 'api/config/publicCachePolicy.js'
      - 'client/src/pages/GestisciOpinioni/**'
      - 'client/src/pages/Gestisci/constants/hubs.ts' # required contract for changing proposal entry points
      - 'client/src/pages/Gestisci/components/SectionsGrid.tsx' # validate Admin nav restructuring
      - 'client/src/pages/DpoPanel.tsx' # DPO read-only mobile layout and separate area views
      - 'client/src/pages/Admin/OpsCenter.tsx' # required Admin security-status read-only contract
      - 'client/src/robust-layout.css' # DPO viewport adjustments require frontend build and catalog contract
      - 'client/src/pages/Gestisci/ProposteSoggetti.tsx' # Admin real-data contract required
      - 'client/src/pages/CapodiStato/**' # required catalog-contract for Capo di Stato UI updates
      - 'client/src/pages/Amnistia/**' # required catalog-contract for Amnistia UI updates
      - 'client/src/pages/Governo/**' # validate government and ministry mobile scrolling
      - 'client/src/components/RobustAppLayout.tsx' # shared fixed-viewport scroll shell
      - 'client/src/components/PageTransition.tsx' # route transition must not retain stale pages
      - 'api/tests/ministerProfileTransition.contract.test.js' # ministry-to-profile white-screen regression
      - 'api/tests/civicScrollContract.test.js' # scroll regression contract
      - 'api/tests/d12AdminRealRecords.contract.test.js'
      - 'client/src/pages/VotiPolitici.tsx' # required catalog-contract for UI-only fix
      - 'client/src/pages/VotiPoliticiFinali.tsx'
      - 'client/src/pages/VotiParlamento.tsx' # required catalog-contract on parliament feed UI
      - 'client/src/components/VotazioniFinaliOpenpolis.tsx'
      - 'client/tests/parliamentFinalSourceFeed.test.mjs'
      - 'client/src/pages/Profilo/components/PoliticalCompassPreview.tsx' # required catalog-contract for compass UI changes
      - 'client/src/pages/Profilo/index.tsx' # owner opinion completion UI
      - 'client/src/pages/Profilo/components/ProfileInfo.tsx' # profile summary changes require contract check
      - 'client/src/pages/Profilo/components/ProfileGovernoIdeale.tsx'
      - 'client/src/pages/Profilo/components/ProfileChosenPreferences.tsx' # choice emojis and avatars
      - 'client/src/pages/Profilo/utils/initiativeChoiceEmoji.ts'
      - 'api/tests/profileOtherChoicesEmojis.contract.test.js'
      - 'api/tests/profileChosenOpinionProposal.contract.test.js'
      - 'api/tests/profileSelections.smoke.test.js'
      - 'client/src/lib/profileMutationPolicy.ts'
      - 'client/tests/profileSelectiveInvalidation.test.mjs'
      - 'client/src/pages/Profilo/hooks/useProfileData.ts'
      - 'client/src/pages/Profilo/utils/encryptedProfileVault.ts'
      - 'api/tests/profileIdealGovernmentAvatars.contract.test.js'
      - 'client/src/pages/Profilo/components/CompleteOpinionsCallout.tsx'
      - 'client/src/pages/CompassoPolitico.tsx'
      - 'client/src/pages/Proponi.tsx' # signature navigation
      - 'client/src/pages/PetizioniParlamentari/**' # petition guidance must satisfy catalog-contract
      - 'api/tests/parliamentaryPetitionsEntry.smoke.test.js' # petition links, copy and privacy regression
      - 'client/src/pages/Eventi.tsx' # local Events territory must satisfy the required catalog-contract
      - 'client/src/utils/eventTerritoryView.ts'
      - 'client/src/utils/localEventArea.ts'
      - 'client/src/data/municipalityCentroids-*.json'
      - 'api/tests/eventTerritoryViews.integration.test.js'
      - 'client/android/app/src/main/AndroidManifest.xml' # foreground GPS permission must satisfy the required catalog-contract
      - 'api/tests/completeOpinionsCallout.contract.test.js'
      - 'api/tests/unifiedSubjectProposalNavigation.contract.test.js'
      - 'client/src/App.tsx' # required contract for front routing change
      - 'client/src/lib/colorScheme.ts' # shared UI themes must satisfy required catalog-contract
      - 'client/src/css/color-scheme.css'
      - 'client/src/pages/Impostazioni/**'
      - 'client/src/main.tsx'
      - 'client/tailwind.config.js'
      - 'client/tests/colorScheme.test.mjs'
      - 'client/public/app-ads.txt'
      - 'client/android/app/build.gradle' # Android version bump must satisfy required catalog-contract on PRs
      - '.github/workflows/android-alpha-validation.yml' # CI guard PRs must satisfy required catalog-contract
      - '.github/workflows/android-app-open-qa-manual.yml' # QA workflow changes must satisfy required catalog-contract
      - 'scripts/check-ads-free-aab.py'
      - 'scripts/test_ads_free_aab_guard.py'
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/CookiePolicy.tsx'
      - 'client/tests/privacyDisclosureIntegrity.test.mjs'
      - '.github/workflows/opinion-catalog-full-ci.yml'
permissions:
  contents: read
jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demos_ci
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: demos_opinion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demos_ci -d demos_opinion_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate all migrated backend files parse
        run: |
          for file in api/services/opinionCatalog.js api/routes/compatibility.js api/routes/opinioni/management.js api/routes/opinioni/user-answers.js api/routes/opinioni/stats.js api/routes/sondaggi.js api/routes/opinioni-proposte.js api/routes/users/profile.js api/routes/statistiche.js api/routes/bacheca.js; do
            node --check "$file"
          done
      - name: Parliamentary petitions official-only content and links
        run: node --test api/tests/parliamentaryPetitionsEntry.smoke.test.js
      - name: Catalog integrity and zero-DB-metadata contract
        run: node --test api/tests/opinionCatalog.contract.test.js api/tests/opinionCatalogIntegration.contract.test.js
      - name: Validate thematic mapping against all published opinion IDs
        run: node --test api/tests/opinionTopics.contract.test.js
      - name: Install backend dependencies for isolated HTTP regression
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate read-only cutover parity and answer-column schema regression
        run: node --test api/tests/opinionCatalogPreflight.test.js
      - name: Android 1.0.10 legacy Opinions HTTP contract (no real accounts)
        run: node --test api/tests/opinionCatalogAndroid110.contract.test.js api/tests/opinionCatalogConsentRace.contract.test.js api/tests/opinionCatalogReadCachePolicy.test.js
      - name: Render QA synthetic service security and candidate HTTP smoke
        run: node --test api/tests/opinionCatalogQaServer.smoke.test.js
      - name: Install frontend without lifecycle scripts
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Verify thematic completion and owner-consent cache behavior
        run: node --test client/tests/opinionTopicProgress.test.mjs
      - name: Verify thematic draft rebase and cross-account discard
        run: node --test client/tests/opinionTopicDrafts.test.mjs
      - name: Exercise real PostgreSQL API and production client save/readback (synthetic DB only)
        env:
          OPINION_TEST_DATABASE_URL: postgres://demos_ci:synthetic_only@127.0.0.1:5432/demos_opinion_ci
        run: node --test api/tests/opinionCatalogPostgres.integration.test.js
      - name: Guard ministry to Profile navigation against stale routes
        run: node --test api/tests/ministerProfileTransition.contract.test.js
      - name: Validate Profile ideal-government avatars and encrypted cache compatibility
        run: node --test api/tests/profileIdealGovernmentAvatars.contract.test.js api/tests/governoVoteAvatars.test.js
      - name: Validate private profile selections, proposal ownership, avatars and emoji
        run: |
          node --test api/tests/profileSelections.smoke.test.js api/tests/profileChosenOpinionProposal.contract.test.js api/tests/profileOtherChoicesEmojis.contract.test.js api/tests/profileOtherChoicesAvatars.contract.test.js
          node --test client/tests/profileSelectiveInvalidation.test.mjs
      - name: TypeScript and Vite frontend build (no release)
        run: npm run build --prefix client
      - name: Install isolated Chromium browser test dependency
        run: |
          command -v google-chrome
          mkdir -p /tmp/demos-opinion-browser
          npm install --prefix /tmp/demos-opinion-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Real browser Opinions UI, save and readback against localhost synthetic API
        env:
          DEMOS_PLAYWRIGHT_MODULE: /tmp/demos-opinion-browser/node_modules/playwright
          CI: 'true'
          NODE_ENV: production
        run: node --test api/tests/opinionCatalogBrowser.e2e.test.js
      - name: Chrome thematic Opinions, mobile, save, failed POST and revocation (synthetic only)
        env:
          DEMOS_PLAYWRIGHT_MODULE: /tmp/demos-opinion-browser/node_modules/playwright
          CI: 'true'
          NODE_ENV: production
        run: node --test api/tests/opinionTopicsBrowser.e2e.test.js
      - name: Chrome two-account ownership and independent consent revocation (synthetic only)
        env:
          DEMOS_PLAYWRIGHT_MODULE: /tmp/demos-opinion-browser/node_modules/playwright
          CI: 'true'
          NODE_ENV: production
        run: node --test api/tests/opinionTopicsAccountIsolation.e2e.test.js

  # Temporary, explicit source overlay; no branch merge, release or external DB.
  # This proves the exact pinned P0 read-guard code + thematic UI can coexist.
  # It does NOT show the guard has landed on main or authorize production.
  consent-topic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demos_ci
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: demos_political_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demos_ci -d demos_political_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout thematic branch under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail closed when P0 branch has advanced
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_P0_SHA: 4c979159839ecf58ecd2258f065c9a2cdf9b3911
        run: |
          set -eu
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/fix/p0-political-consent-read-main-20261102" --jq '.object.sha')"
          if [ "$actual" != "$EXPECTED_P0_SHA" ]; then
            echo "::error::PR #557 moved. Update the pinned P0 revision, review the diff and rerun this integration before considering it green."
            exit 1
          fi
          echo 'P0 branch HEAD matches pinned integration test.'
      - name: Checkout pinned P0 consent fix (PR 557) for isolated overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4c979159839ecf58ecd2258f065c9a2cdf9b3911
          path: consent-guard
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Assemble temporary P0 guard + topic editor (no git merge)
        run: |
          set -eu
          for file in \
            api/routes/compatibility.js \
            api/routes/users/profile.js \
            api/services/politicalMatchingService.js \
            api/qa/opinionCatalogQaServer.js \
            api/tests/opinionCatalogAndroid110.contract.test.js \
            api/tests/opinionCatalogQaServer.smoke.test.js \
            api/tests/politicalConsentMainRead.synthetic.test.js \
            api/tests/politicalConsentMainRead.pg.integration.test.js \
            api/tests/politicalMatchingService.test.js; do
            cp "consent-guard/$file" "$file"
          done
          rm -rf consent-guard
          grep -Fq 'COALESCE(uc.political_opinions_consent, u.political_opinions_consent, false) IS TRUE' api/routes/compatibility.js
          grep -Fq 'SECOND_USER_ID' api/qa/opinionCatalogQaServer.js
          grep -Fq 'retainedResidualRow' api/qa/opinionCatalogQaServer.js
          node --check api/routes/compatibility.js
          node --check api/routes/users/profile.js
          node --check api/services/politicalMatchingService.js
          node --check api/qa/opinionCatalogQaServer.js
          echo 'Combined pinned worktree validated; main remains unchanged.'
      - name: Install isolated test dependencies
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Combined P0, Android, thematic mapping and owner isolation Node tests
        run: |
          node --test \
            api/tests/politicalConsentMainRead.synthetic.test.js \
            api/tests/opinionCatalogAndroid110.contract.test.js \
            api/tests/opinionCatalogQaServer.smoke.test.js \
            api/tests/opinionCatalogConsentRace.contract.test.js \
            api/tests/opinionTopics.contract.test.js
          node --test client/tests/opinionTopicProgress.test.mjs client/tests/opinionTopicDrafts.test.mjs
      - name: PostgreSQL 17 consent-revocation integration on pinned P0 + thematic code
        env:
          CIVIC_TEST_MODE: isolated-synthetic
          CIVIC_TEST_DATABASE_URL: postgres://demos_ci:synthetic_only@127.0.0.1:5432/demos_political_ci
        run: |
          node --test api/tests/politicalConsentMainRead.pg.integration.test.js
      - name: Combined frontend production build (no deploy)
        run: npm run build --prefix client
      - name: Install Chrome-only browser tester
        run: |
          command -v google-chrome
          mkdir -p /tmp/demos-opinion-browser
          npm install --prefix /tmp/demos-opinion-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Three combined isolated Chrome regressions
        env:
          DEMOS_PLAYWRIGHT_MODULE: /tmp/demos-opinion-browser/node_modules/playwright
          NODE_ENV: production
          CI: 'true'
        run: |
          node --test api/tests/opinionCatalogBrowser.e2e.test.js
          node --test api/tests/opinionTopicsBrowser.e2e.test.js
          node --test api/tests/opinionTopicsAccountIsolation.e2e.test.js
