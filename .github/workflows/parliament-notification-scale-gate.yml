name: DEMOS Parliament Notification Scale Gate (synthetic)

on:
  pull_request:
    branches: [feat/parliament-verified-ballots-20261103]
    paths:
      - 'api/tests/parliamentNotificationScalePostgres.integration.js'
      - 'api/services/parliamentLatestVoteNotificationsService.js'
      - 'api/tests/parliamentLatestVoteNotifications.test.js'
      - 'api/services/parliamentFinalBallotPushService.js'
      - 'api/tests/parliamentFinalBallotPush.test.js'
      - '.github/workflows/parliament-notification-scale-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demos_test
          POSTGRES_PASSWORD: temporary_ci_only
          POSTGRES_DB: demos_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U demos_test -d demos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install local API dependencies only
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and isolated synthetic scale model
        env:
          TEST_PARLIAMENT_PG_EPHEMERAL: 'true'
          TEST_PARLIAMENT_PG_URL: postgres://demos_test:temporary_ci_only@127.0.0.1:55432/demos_test
        run: |
          node --check api/services/parliamentLatestVoteNotificationsService.js
          node --check api/services/parliamentFinalBallotPushService.js
          node --check api/tests/parliamentNotificationScalePostgres.integration.js
          node --test api/tests/parliamentLatestVoteNotifications.test.js api/tests/parliamentFinalBallotPush.test.js
          node api/tests/parliamentNotificationScalePostgres.integration.js
