name: One-off territorial Eventi production smoke

on:
  pull_request:
    paths:
      - '.github/workflows/eventi-territoriali-prod-smoke.yml'

jobs:
  public-eventi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate anonymous approved Eventi feed in production
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const response = await fetch('https://api.demos.community/api/eventi/pubblici', {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(45000)
            });
            const payload = await response.json();
            const rows = Array.isArray(payload.data) ? payload.data : [];
            const imported = rows.filter(x => x.external_import === true);
            const native = rows.filter(x => x.external_import !== true);
            const fields = ['approval_status', 'rejection_reason', 'creator_user_id', 'CONTATTI', 'email'];
            const unsafeFields = rows.some(x => fields.some(f => Object.hasOwn(x, f)));
            const leakedEmail = native.some(x => String(x.organizzatore || '').includes('@'));
            const datesOk = imported.every(x => typeof x.giorno_inizio === 'string' && Boolean(x.fonte_url));
            console.log(JSON.stringify({
              check: 'EVENTI_TERRITORIAL_PRODUCTION', status: response.status,
              count: rows.length, imported: imported.length, native: native.length,
              cache: response.headers.get('cache-control'),
              unsafeFields, leakedEmail, datesOk,
              error: payload.error || null
            }));
            assert.equal(response.status, 200);
            assert.equal(payload.success, true);
            assert.ok(imported.length > 0);
            assert.equal(unsafeFields, false);
            assert.equal(leakedEmail, false);
            assert.equal(datesOk, true);
            assert.match(response.headers.get('cache-control') || '', /public/);
          })().catch(e => { console.error('SMOKE_ERROR', e.message); process.exitCode = 1; });
          NODE
