name: GDPR legacy DB pool, TLS and rights request regression (offline)

on:
  pull_request:
    paths:
      - 'api/config/db.js'
      - 'api/config/database.js'
      - 'api/utils/databaseTlsPolicy.js'
      - 'api/routes/user/gdpr-requests.js'
      - 'api/app.js'
      - 'api/tests/corsRenderFrontend.test.js'
      - 'api/routes/user/gdpr-rights.js'
      - 'api/services/gdprRightsHistoryService.js'
      - 'client/src/pages/GDPRRights.tsx'
      - 'client/src/pages/GDPR/index.tsx'
      - 'client/src/pages/Impostazioni/LimitazioneTrattamento/index.tsx'
      - 'client/src/pages/Impostazioni/OpposizioneTrattamento/index.tsx'
      - 'client/src/lib/gdprRightsSubmission.ts'
      - 'client/src/lib/gdprDataExport.ts'
      - 'client/tests/gdprDataExport.test.mjs'
      - 'client/tests/gdprRightsForms.test.mjs'
      - 'api/tests/gdprRightsClientSubmission.test.js'
      - 'api/tests/gdprLegacyDbPoolCompat.test.js'
      - 'api/tests/gdprLegacyRequestsRoute.test.js'
      - 'api/tests/gdprRightsHttpPrivacy.test.js'
      - 'api/services/gdprCsvExport.js'
      - 'api/tests/gdprLegacyRequestsPg17.test.js'
      - 'api/tests/gdprPersonalExportPg17.test.js'
      - 'api/tests/gdprFullExportPg17.test.js'
      - 'api/services/gdprPersonalExportDatasets.js'
      - 'api/docs/gdpr-legacy-db-rights-hardening-20261028.md'
      - 'api/docs/gdpr-rights-idempotent-retries-20261028.md'
      - 'api/tests/databaseTlsPolicy.test.js'
      - '.github/workflows/gdpr-legacy-db-pool-compat-ci.yml'

permissions:
  contents: read

jobs:
  gdpr-legacy-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: gdpr_legacy_rights_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gdpr_legacy_rights_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies with lifecycle scripts disabled
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Verify legacy DB alias, TLS and persistent GDPR requests (offline)
        run: |
          node --check api/app.js
          node --check api/tests/corsRenderFrontend.test.js
          node --test api/tests/corsRenderFrontend.test.js
          node --check api/config/db.js
          node --check api/routes/user/gdpr-requests.js
          node --check api/routes/user/gdpr-rights.js
          node --check api/tests/gdprLegacyDbPoolCompat.test.js
          node --check api/tests/gdprLegacyRequestsRoute.test.js
          node --test --test-concurrency=1 api/tests/gdprLegacyDbPoolCompat.test.js api/tests/gdprLegacyRequestsRoute.test.js api/tests/gdprRightsHttpPrivacy.test.js api/tests/databaseTlsPolicy.test.js
      - name: Verify real persisted requests and RLS fail-closed in PostgreSQL 17
        env:
          GDPR_LEGACY_PG_CI: isolated
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_legacy_rights_ci
        run: |
          node --check api/tests/gdprLegacyRequestsPg17.test.js
          node --test --test-concurrency=1 api/tests/gdprLegacyRequestsPg17.test.js
          node --check api/services/gdprPersonalExportDatasets.js
          node --check api/tests/gdprPersonalExportPg17.test.js
          node --test --test-concurrency=1 api/tests/gdprPersonalExportPg17.test.js
          node --check api/tests/gdprFullExportPg17.test.js
          node --test --test-concurrency=1 api/tests/gdprFullExportPg17.test.js

  gdpr-history-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies without lifecycle scripts
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Verify real client retry and personal-export contracts without providers
        run: |
          node api/tests/gdprRightsClientSubmission.test.js
          node client/tests/gdprDataExport.test.mjs
          node client/tests/gdprRightsForms.test.mjs
      - name: Build client to verify mounted GDPR screens
        run: npm run build --prefix client


  # Integration probe only: merges two OPEN draft heads inside a disposable
  # GitHub Actions worktree. No GitHub merge/commit/push, no Render/Supabase/B2.
  gdpr-composed-draft-synthetic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: gdpr_legacy_rights_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gdpr_legacy_rights_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compose review-only PR 374 and PR 376 in an ephemeral worktree
        shell: bash
        env:
          PINNED_LEDGER_HEAD: 79d0259a83c53d37721a5e2e9e48711ac562b8e9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin refs/pull/374/head:refs/remotes/origin/synthetic-ledger-374
          test "$(git rev-parse refs/remotes/origin/synthetic-ledger-374)" = "$PINNED_LEDGER_HEAD"
          git -c user.name='Synthetic CI' -c user.email='synthetic@example.invalid' \
            merge --no-commit --no-ff refs/remotes/origin/synthetic-ledger-374
          test -f .git/MERGE_HEAD
          test -f api/services/privacyErasureOutboxWorker.js
          test -f api/services/gdprPersonalExportDatasets.js
          echo 'Drafts composed only in runner worktree. No commit, merge to main or deployment.'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install backend test dependencies (no lifecycle scripts)
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Initialize dedicated synthetic databases in disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {Client}=require('./api/node_modules/pg');
          const client=new Client({
            connectionString:'postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_legacy_rights_ci',
            ssl:false
          });
          (async()=>{
            await client.connect();
            try {
              for(const name of ['privacy_synthetic','gdpr_outbox_contract_ci','gdpr_outbox_worker_ci']) {
                await client.query('CREATE DATABASE '+name);
              }
            } finally { await client.end(); }
          })().catch(error=>{console.error(error.code||'PG_SYNTHETIC_INIT_FAILED');process.exitCode=1;});
          NODE
      - name: Check combined rights, TLS, audit and HTTP contracts (no providers)
        run: |
          node --test --test-concurrency=1 \
            api/tests/gdprLegacyDbPoolCompat.test.js \
            api/tests/gdprLegacyRequestsRoute.test.js \
            api/tests/gdprRightsHttpPrivacy.test.js \
            api/tests/databaseTlsPolicy.test.js
      - name: Verify composed account-deletion HTTP failure handling with synthetic mocks
        run: node --test api/tests/accountDeletion.integration.test.js
      - name: Check rights/export JSON and CSV against isolated PostgreSQL 17
        env:
          GDPR_LEGACY_PG_CI: isolated
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_legacy_rights_ci
        run: |
          node --test --test-concurrency=1 api/tests/gdprLegacyRequestsPg17.test.js
          node --test --test-concurrency=1 api/tests/gdprPersonalExportPg17.test.js
          node --test --test-concurrency=1 api/tests/gdprFullExportPg17.test.js
      - name: Check secure ledger against isolated PostgreSQL 17
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@localhost:5432/privacy_synthetic
        run: |
          node --test --test-concurrency=1 api/tests/privacyLedgerSecureBootstrap.pg17.test.js
      - name: Check audit cleanup provider fail-closed in composed drafts (synthetic)
        run: node --test api/tests/auditCleanupFailClosed.test.js
      - name: Check production-shaped account deletion on latest ledger (synthetic PG17)
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-only@localhost:5432/privacy_synthetic
        run: node --test --test-concurrency=1 api/tests/accountDeletionProductionShape.pg17.test.js
      - name: Recycle global synthetic API roles after secure-ledger tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {Client}=require('./api/node_modules/pg');
          const client=new Client({
            connectionString:'postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_legacy_rights_ci',ssl:false
          });
          (async()=>{
            await client.connect();
            try{
              // PostgreSQL roles are cluster-global even when test databases differ.
              await client.query('DROP DATABASE privacy_synthetic WITH (FORCE)');
              for(const role of ['anon','authenticated','service_role']){
                await client.query('DROP ROLE IF EXISTS '+role);
              }
            }finally{await client.end();}
          })().catch(error=>{console.error(error.code||'SYNTHETIC_ROLE_RESET_FAILED');process.exitCode=1;});
          NODE
      - name: Check synthetic outbox atomic rollback and protected worker receipts
        shell: bash
        run: |
          set -euo pipefail
          GDPR_OUTBOX_CI=isolated \
            TEST_DATABASE_URL=postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_outbox_contract_ci \
            node --test --test-concurrency=1 api/tests/gdprOutboxAtomicIsolated.pg17.test.js
          # The previous test creates cluster-global API roles and a writer.
          # Drop its disposable database and roles before the next isolated
          # test. None of these operations target any external database.
          node <<'NODE'
          const {Client}=require('./api/node_modules/pg');
          const c=new Client({
            connectionString:'postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_legacy_rights_ci',
            ssl:false
          });
          (async()=>{
            await c.connect();
            try{
              await c.query('DROP DATABASE gdpr_outbox_contract_ci WITH (FORCE)');
              for(const role of ['anon','authenticated','service_role','gdpr_outbox_ci_writer']){
                await c.query('DROP ROLE IF EXISTS '+role);
              }
            }finally{await c.end();}
          })().catch(error=>{console.error(error.code||'SYNTHETIC_ATOMIC_RESET_FAILED');process.exitCode=1;});
          NODE
          GDPR_OUTBOX_WORKER_CI=isolated \
            TEST_DATABASE_URL=postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_outbox_worker_ci \
            node --test --test-concurrency=1 api/tests/gdprOutboxWorkerIsolated.pg17.test.js
          GDPR_BACKEND_POOL_CI=isolated \
            TEST_DATABASE_URL=postgresql://postgres:synthetic-only@127.0.0.1:5432/gdpr_outbox_worker_ci \
            node --test --test-concurrency=1 api/tests/gdprBackendPoolIsolated.pg17.test.js
