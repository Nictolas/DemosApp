name: PR156 Android qualification

on:
  push:
    branches:
      - fix/android-auth-pwa-20261014
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr156-android-qualification
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web dependencies
        working-directory: client
        run: npm ci

      - name: Build web bundle
        working-directory: client
        env:
          VITE_API_URL: https://api.demos.community
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client
        run: npx cap sync android

      - name: Install Android API 36 if needed
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK and release AAB
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Show produced artifacts
        if: always()
        run: |
          find client/android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
