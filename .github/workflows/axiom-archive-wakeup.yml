name: Axiom archive wakeup

on:
  # Scheduled workflows run only from the default branch. Until this PR is merged,
  # this schedule has no production effect.
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-archive-wakeup
  cancel-in-progress: false

jobs:
  wake-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render backend and wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          URL='https://demos-c7k0.onrender.com/'

          # Render Free can take about a minute to wake from idle. A successful
          # startup executes AXIOM_ARCHIVE_RUN_ON_START=true in production.
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 "$URL" || true)"

            if printf '%s' "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"running"'; then
              echo "DEMOS backend is running; archive run-on-start has been triggered when a cold start occurred."
              exit 0
            fi

            echo "Backend not ready yet (attempt ${attempt}/6); retrying in 15s..."
            sleep 15
          done

          echo "Backend did not become ready within the wakeup window." >&2
          exit 1
