name: SQL Diagnostics Production Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/routes/health.js'
      - 'api/routes/database.js'
      - 'api/routes/test-db.js'
      - 'api/tests/devDbDiagnosticsExposure.test.js'
      - '.github/workflows/sql-diagnostics-production-guard.yml'

permissions:
  contents: read

jobs:
  diagnostic-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci --ignore-scripts
      - name: Prove production diagnostic routes fail closed
        run: node --test api/tests/devDbDiagnosticsExposure.test.js
