name: Opinion 2-bit prototype

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/utils/opinionBitset.js'
      - 'api/utils/opinionTrimmedBitset.js'
      - 'api/utils/opinionSparseBitset.js'
      - 'api/utils/opinionCodecEnvelope.js'
      - 'api/utils/opinionCatalogManifest.js'
      - 'api/tests/opinionCatalogManifest.test.js'
      - 'api/scripts/verify-opinion-catalog-persistence.js'
      - 'api/tests/opinionBitset.test.js'
      - 'api/tests/opinionTextAggregateProbe.test.js'
      - 'api/utils/opinionTextAggregateProbe.js'
      - 'api/scripts/benchmark-opinion-text-aggregate.js'
      - 'api/tests/opinionTrimmedBitset.test.js'
      - 'api/tests/opinionSparseBitset.test.js'
      - 'api/tests/opinionMatchingBitset.test.js'
      - 'api/tests/opinionCodecEnvelope.test.js'
      - 'api/tests/opinionCodecHttpContract.test.js'
      - 'api/tests/opinionClientCacheContract.test.mjs'
      - 'client/src/lib/opinionQueryKeys.ts'
      - 'client/src/lib/queryClient.ts'
      - 'client/tests/opinionQueryCancellation.test.mjs'
      - 'client/src/pages/OpinioniNazionali.tsx'
      - 'client/src/pages/OpinioniRegionali.tsx'
      - 'client/src/pages/OpinioniComunali.tsx'
      - 'client/src/pages/OpinioniEuropee.tsx'
      - 'client/src/pages/StatisticheOpinione/components/OpinionSelector.tsx'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/src/pages/GDPR/index.tsx'
      - 'client/src/pages/Impostazioni/CancellaAccount/index.tsx'
      - 'api/routes/compatibility.js'
      - 'api/tests/ordinaryUserOpinionSave.test.js'
      - 'api/scripts/benchmark-opinion-bitset.js'
      - 'api/scripts/benchmark-opinion-physical.js'
      - 'api/scripts/benchmark-opinion-queries.js'
      - 'api/scripts/verify-opinion-privacy-equivalence.js'
      - 'api/docs/opinion-bitset-trimmed-probe-20261024.md'
      - 'api/docs/opinion-bitset-prototype.md'
      - '.github/workflows/opinion-bitset-prototype.yml'

permissions:
  contents: read

jobs:
  codec-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test 2-bit codec and catalog invariants
        run: node --test api/tests/opinionBitset.test.js api/tests/opinionTrimmedBitset.test.js api/tests/opinionSparseBitset.test.js api/tests/opinionMatchingBitset.test.js api/tests/opinionCodecEnvelope.test.js api/tests/opinionCatalogManifest.test.js
      - name: Test isolated TEXT aggregate SQL builder
        run: node --test api/tests/opinionTextAggregateProbe.test.js
      - name: Check account-scoped opinion cache and revocation purge
        run: node --experimental-strip-types --test api/tests/opinionClientCacheContract.test.mjs
      - name: Run deterministic standalone benchmark
        run: node api/scripts/benchmark-opinion-bitset.js

  physical-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opinion_bitset_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opinion_bitset_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies without lifecycle scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Exercise real HTTP opinion routes with synthetic mocked pool
        # Direct node:test execution avoids intermittent worker IPC deserialization errors.
        run: node api/tests/opinionCodecHttpContract.test.js
      - name: Verify existing consent revocation cleanup with synthetic mocks
        run: node --test api/tests/politicalConsentAtomic.smoke.test.js
      - name: Regression-check the existing authenticated opinion POST HTTP endpoint
        run: node --test api/tests/ordinaryUserOpinionSave.test.js
      - name: Measure real PostgreSQL heap, index and TOAST allocations
        env:
          OPINION_BENCH_EPHEMERAL: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: opinion_bitset_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/benchmark-opinion-physical.js
      - name: Verify SQL statistics, row locks and CAS; sample server query times
        env:
          OPINION_BENCH_EPHEMERAL: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: opinion_bitset_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/benchmark-opinion-queries.js
      - name: Compare legacy TEXT N+1 queries with grouped TEXT on synthetic data
        env:
          OPINION_BENCH_EPHEMERAL: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: opinion_bitset_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/benchmark-opinion-text-aggregate.js
      - name: Verify PERSON consent joins and anti-inference threshold for all codecs
        env:
          OPINION_BENCH_EPHEMERAL: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: opinion_bitset_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-opinion-privacy-equivalence.js
      - name: Test catalog durability across PostgreSQL sessions and serialized appends
        env:
          OPINION_BENCH_EPHEMERAL: 'yes'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: opinion_bitset_ci
          PGUSER: postgres
          PGPASSWORD: synthetic-only
        run: node api/scripts/verify-opinion-catalog-persistence.js
