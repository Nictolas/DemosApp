name: Opinion catalog snapshot (no deploy)
on:
  push:
    branches: [performance/opinion-catalog-in-code-20261028]
  pull_request:
    paths:
      - 'api/catalog/**'
      - 'api/services/opinionCatalog.js'
      - 'api/tests/opinionCatalog.contract.test.js'
      - 'api/scripts/checkOpinionCatalogParity.js'
      - '.github/workflows/opinion-catalog-ci.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test api/tests/opinionCatalog.contract.test.js
