name: Privacy disclosure mobile browser regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/pages/PrivacyPolicy.tsx'
      - 'client/src/pages/CookiePolicy.tsx'
      - 'client/tests/privacyDisclosureIntegrity.test.mjs'
      - 'scripts/test-privacy-disclosures-mobile-browser.cjs'
      - '.github/workflows/privacy-disclosures-mobile-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend without lifecycle hooks
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Privacy text and mobile card source contracts
        run: node --test client/tests/privacyDisclosureIntegrity.test.mjs
      - name: Build local production frontend (no deployment)
        run: npm run build --prefix client
      - name: Install isolated Chromium for UI regression
        run: |
          npm install --prefix /tmp/demos-privacy-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node /tmp/demos-privacy-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check mobile card / desktop table rendering and viewport clipping
        env:
          CI: 'true'
        run: |
          npm run preview --prefix client -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/demos-privacy-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/cookie-policy > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/demos-privacy-browser/node_modules node scripts/test-privacy-disclosures-mobile-browser.cjs
