name: DEMOS Parliament Latest Notification Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/services/parliamentLatestVoteNotificationsService.js'
      - 'api/database/20261103_latest_parliament_votes.sql'
      - 'api/jobs/openpolisVotazioniFinaliJob.js'
      - 'api/routes/notifiche.js'
      - 'api/tests/parliamentLatestVoteNotifications.test.js'
      - 'client/src/pages/Notifiche/**'
      - 'client/tests/parliamentNotificationIntegration.test.mjs'
      - '.github/workflows/parliament-latest-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies (no scripts)
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Check syntax and execute replacement and fail-closed tests
        run: |
          node --check api/services/parliamentLatestVoteNotificationsService.js
          node --check api/jobs/openpolisVotazioniFinaliJob.js
          node --check api/routes/notifiche.js
          node --test api/tests/parliamentLatestVoteNotifications.test.js api/tests/parliamentVerifiedFinalBallots.test.js
      - name: Verify notification UI wiring
        run: node --test client/tests/parliamentNotificationIntegration.test.mjs
      - name: Install frontend dependencies (no scripts)
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build --prefix client
