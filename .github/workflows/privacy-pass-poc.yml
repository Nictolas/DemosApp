name: Privacy Pass POC

on:
  pull_request:
    branches: [main]
    paths:
      - "poc/privacy-pass/**"
      - ".github/workflows/privacy-pass-poc.yml"

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/privacy-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: poc/privacy-pass/package-lock.json
      - run: npm install --no-fund --no-audit
      - run: npm run poc
