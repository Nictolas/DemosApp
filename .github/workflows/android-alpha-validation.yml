name: Android Alpha Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/services/oauthRegistrationService.js'
      - 'api/tests/oauthRegistrationService.test.js'
      - 'api/tests/androidAuthNativePushIntegration.test.js'
      - 'client/android/app/build.gradle'
      - 'client/src/css/android-navbar-fix.css'
      - 'api/tests/navbarResponsiveContract.test.js'
      - 'client/android/app/src/main/res/mipmap-*/**'
      - 'client/public/icona.png'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'scripts/android-release-metadata.cjs'
      - 'scripts/android-release-metadata.test.cjs'
      - 'client/src/pages/Sostenitori.tsx'
      - 'client/tests/supportersPage.test.mjs'
      - 'api/routes/sostenitori.js'
      - 'api/tests/supporterCountPrivacy.smoke.test.js'
      - 'api/tests/supporterCountHttpPrivacy.test.js'
      - '.github/workflows/android-alpha-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install API dependencies
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Run OAuth registration and Android auth regression tests
        run: node --test api/tests/oauthRegistrationService.test.js api/tests/androidAuthNativePushIntegration.test.js

      - name: Verify release artifact identity guard
        run: node --test scripts/android-release-metadata.test.cjs

      - name: Check responsive Android navbar contract
        run: node --test api/tests/navbarResponsiveContract.test.js

      - name: Verify supporters private aggregates and access boundaries
        run: node --test api/tests/supporterCountPrivacy.smoke.test.js api/tests/supporterCountHttpPrivacy.test.js

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Verify supporters session loading and private count request
        run: node client/tests/supportersPage.test.mjs

      - name: Generate Capacitor Android project files
        working-directory: client
        run: npm run android:sync

      - name: Verify DEMOS launcher assets
        shell: bash
        run: |
          expected="$(sha256sum client/public/icona.png | awk '{print $1}')"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for name in ic_launcher ic_launcher_foreground ic_launcher_round; do
              file="client/android/app/src/main/res/mipmap-${density}/${name}.png"
              test -f "$file"
              actual="$(sha256sum "$file" | awk '{print $1}')"
              test "$actual" = "$expected"
            done
          done

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android debug APK and release AAB (unsigned in CI)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Validate compiled Android identity against Gradle
        id: android_metadata
        run: node scripts/android-release-metadata.cjs

      - name: Archive UNSIGNED release candidate for authorized signing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.android_metadata.outputs.artifact_name }}
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
