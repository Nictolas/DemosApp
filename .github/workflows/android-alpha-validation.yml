name: Android Alpha Validation

on:
  pull_request:
    branches:
      - main
      - performance/opinion-catalog-in-code-20261028
      - integration/opinioni-catalog-privacy-20261029
    paths:
      - 'api/services/oauthRegistrationService.js'
      - 'api/tests/oauthRegistrationService.test.js'
      - 'api/tests/androidAuthNativePushIntegration.test.js'
      - 'api/catalog/**'
      - 'api/services/opinionCatalog.js'
      - 'api/routes/compatibility.js'
      - 'api/routes/opinioni/**'
      - 'api/tests/opinionCatalogAndroid110.contract.test.js'
      - 'client/android/app/build.gradle'
      - 'client/android/app/src/androidTest/**'
      - 'client/src/css/android-navbar-fix.css'
      - 'api/tests/navbarResponsiveContract.test.js'
      - 'client/android/app/src/main/res/mipmap-*/**'
      - 'client/public/icona.png'
      - 'client/package.json'
      - 'client/package-lock.json'
      - '.github/workflows/android-alpha-validation.yml'
  push:
    branches:
      - integration/opinioni-catalog-privacy-20261029
      - integration/opinioni-full-stack-20261029
      - feat/opinioni-delta-cache-prep-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install API dependencies
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Run OAuth registration and Android auth regression tests
        run: node --test api/tests/oauthRegistrationService.test.js api/tests/androidAuthNativePushIntegration.test.js

      - name: Check responsive Android navbar contract
        run: node --test api/tests/navbarResponsiveContract.test.js

      - name: Verify Android 1.0.10 Opinions API compatibility against isolated backend
        run: node --test api/tests/opinionCatalogAndroid110.contract.test.js

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Generate Capacitor Android project files
        working-directory: client
        run: npm run android:sync

      - name: Verify DEMOS launcher assets
        shell: bash
        run: |
          expected="$(sha256sum client/public/icona.png | awk '{print $1}')"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for name in ic_launcher ic_launcher_foreground ic_launcher_round; do
              file="client/android/app/src/main/res/mipmap-${density}/${name}.png"
              test -f "$file"
              actual="$(sha256sum "$file" | awk '{print $1}')"
              test "$actual" = "$expected"
            done
          done
          # Non bloccare tutte le future PR sul numero di una release passata.
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' client/android/app/build.gradle | head -n1)"
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' client/android/app/build.gradle | head -n1)"
          test -n "$version_code"
          test "$version_code" -gt 0
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'Validated Android versionName=%s, versionCode=%s\n' "$version_name" "$version_code"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android debug APK and release AAB (unsigned in CI)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Archive UNSIGNED release candidate for authorized signing
        uses: actions/upload-artifact@v4
        with:
          name: demos-android-current-UNSIGNED-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # Emulator is deliberately limited to this PR: no credentials or user data.
      - name: Enable KVM for catalog Android emulator
        if: github.head_ref == 'performance/opinion-catalog-in-code-20261028' || github.head_ref == 'integration/opinioni-catalog-privacy-20261029' || github.ref_name == 'integration/opinioni-catalog-privacy-20261029' || github.ref_name == 'integration/opinioni-full-stack-20261029' || github.head_ref == 'integration/opinioni-full-stack-20261029' || github.ref_name == 'feat/opinioni-delta-cache-prep-20261029'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run offline native app smoke on Android emulator
        if: github.head_ref == 'performance/opinion-catalog-in-code-20261028' || github.head_ref == 'integration/opinioni-catalog-privacy-20261029' || github.ref_name == 'integration/opinioni-catalog-privacy-20261029' || github.ref_name == 'integration/opinioni-full-stack-20261029' || github.head_ref == 'integration/opinioni-full-stack-20261029' || github.ref_name == 'feat/opinioni-delta-cache-prep-20261029'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            bash client/android/gradlew -p client/android :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Archive native emulator report
        if: always() && github.head_ref == 'performance/opinion-catalog-in-code-20261028' || github.head_ref == 'integration/opinioni-catalog-privacy-20261029' || github.ref_name == 'integration/opinioni-catalog-privacy-20261029' || github.ref_name == 'integration/opinioni-full-stack-20261029' || github.head_ref == 'integration/opinioni-full-stack-20261029' || github.ref_name == 'feat/opinioni-delta-cache-prep-20261029'
        uses: actions/upload-artifact@v4
        with:
          name: demos-catalog-android-emulator-report
          path: |
            client/android/app/build/reports/androidTests/
            client/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
