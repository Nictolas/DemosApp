name: Parliament Final Votes Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/routes/voti-camera.js'
      - 'api/services/parliamentFinalVotePolicy.js'
      - 'api/tests/parliamentFinalVotePolicy.test.js'
      - 'client/src/pages/VotiPoliticiFinali.tsx'
      - 'client/src/App.tsx'
      - 'client/tests/votiPoliticiFinali.test.mjs'
      - '.github/workflows/parliament-final-votes-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-votes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Check server syntax and final vote policy tests
        run: |
          node --check api/routes/voti-camera.js
          node --check api/services/parliamentFinalVotePolicy.js
          node --test api/tests/parliamentFinalVotePolicy.test.js
      - name: Test recent final-only frontend
        run: node --test client/tests/votiPoliticiFinali.test.mjs
      - name: Install dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build --prefix client
