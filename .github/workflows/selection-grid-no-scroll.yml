name: Political selection grid — no page scroll

on:
  pull_request:
    paths:
      - 'client/src/pages/Rappresentanti/**'
      - 'client/src/pages/Candidati/**'
      - 'client/src/pages/SelectionGrid.css'
      - 'client/tests/selectionGridNoScroll.test.mjs'
      - '.github/workflows/selection-grid-no-scroll.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/pages/Rappresentanti/**'
      - 'client/src/pages/Candidati/**'
      - 'client/src/pages/SelectionGrid.css'
      - 'client/tests/selectionGridNoScroll.test.mjs'
      - '.github/workflows/selection-grid-no-scroll.yml'

permissions:
  contents: read

jobs:
  no-scroll-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check five cards fit the no-scroll grid
        run: node --test client/tests/selectionGridNoScroll.test.mjs
