name: CORS Render frontend regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/app.js'
      - 'api/tests/corsRenderFrontend.test.js'
      - '.github/workflows/cors-render-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'api/app.js'
      - 'api/tests/corsRenderFrontend.test.js'
      - '.github/workflows/cors-render-frontend.yml'

permissions:
  contents: read

jobs:
  cors-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify server syntax
        run: node --check api/app.js
      - name: Verify CORS and operational alert regressions
        run: node --test api/tests/corsRenderFrontend.test.js api/tests/operationalAlerts.smoke.test.js
