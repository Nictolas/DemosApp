name: Temporary axios audit verification

on:
  push:
    branches:
      - fix-axios-security

permissions:
  contents: read

jobs:
  audit-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies from lockfile
        working-directory: api
        run: npm ci --ignore-scripts
      - name: Audit all API dependencies
        working-directory: api
        run: |
          npm audit --json > audit-all.json || true
          node -e "const a=require('./audit-all.json'); console.log('AUDIT_ALL', JSON.stringify(a.metadata?.vulnerabilities || {}))"
      - name: Audit production API dependencies
        working-directory: api
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node -e "const a=require('./audit-prod.json'); console.log('AUDIT_PROD', JSON.stringify(a.metadata?.vulnerabilities || {}))"
