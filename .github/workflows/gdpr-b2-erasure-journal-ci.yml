name: GDPR immutable B2 journal contract (synthetic)

on:
  pull_request:
    paths:
      - 'api/services/privacyErasureB2Journal.js'
      - 'api/tests/privacyErasureB2Journal.test.js'
      - '.github/workflows/gdpr-b2-erasure-journal-ci.yml'
      - 'api/docs/gdpr-b2-erasure-journal-20261026.md'

permissions:
  contents: read

jobs:
  immutable-b2-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install offline-contract dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Check exporter syntax and immutable B2 safety contract
        run: |
          node --check api/services/privacyErasureB2Journal.js
          node --test --test-concurrency=1 api/tests/privacyErasureB2Journal.test.js
