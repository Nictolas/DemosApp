name: Voti Politici scroll and AI button visibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/pages/VotiPolitici.tsx'
      - 'client/tests/votiPoliticiScroll.test.mjs'
      - '.github/workflows/voti-politici-scroll-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-voti-politici:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: UI contract for scroll and admin action
        run: node --test client/tests/votiPoliticiScroll.test.mjs
      - name: Production frontend build without deployment
        run: npm run build --prefix client
