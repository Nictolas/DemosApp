name: Civic new initiative notifications (draft)
on:
  pull_request:
    paths:
      - 'api/database/20261101_civic_new_initiative_notifications.sql'
      - 'api/services/civicNewInitiativeEventCollector.js'
      - 'api/services/civicPushTopics.js'
      - 'api/services/civicPushTopicBootstrap.js'
      - 'api/services/civicPushRollback.js'
      - 'api/services/civicPushRecovery.js'
      - 'api/services/civicRuntimeDatabaseIdentity.js'
      - 'api/tests/civicRuntimeDatabaseIdentity.test.js'
      - 'api/scripts/civicStagingReadOnlyPreflight.sql'
      - 'api/docs/civic-push-recovery-runbook.md'
      - 'api/scripts/civicPushEmergencyStop.js'
      - 'api/scripts/prepareCivicPushRecovery.js'
      - 'api/tests/civicPushRollback.test.js'
      - 'api/tests/civicPushRecovery.test.js'
      - 'api/services/civicPushDeliveryGuard.js'
      - 'api/services/civicSessionLockSafety.js'
      - 'api/tests/civicSessionLockSafety.test.js'
      - 'api/services/civicSessionAffinityProbe.js'
      - 'api/scripts/checkCivicSessionAffinity.js'
      - 'api/tests/civicSessionAffinityProbe.test.js'
      - 'api/services/civicNewInitiativePushDispatcher.js'
      - 'api/routes/civicPushDispatch.js'
      - 'api/routes/fcm-tokens.js'
      - 'api/routes/user/delete-account.js'
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/app.js'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/public/firebase-messaging-sw.js'
      - 'api/tests/civicNewInitiativeNotificationDelivery.test.js'
      - 'api/tests/civicPushTopicBootstrap.test.js'
      - 'api/scripts/reconcileCivicPushTopics.js'
      - 'api/tests/test_civic_migration_postgres.py'
      - 'api/tests/civic_test_database_safety.py'
      - 'api/tests/test_civic_test_database_safety.py'
      - 'api/jobs/ministeroSyncJob.js'
      - 'api/services/ministeroSync.js'
      - 'api/services/ministeroPaginationSafety.js'
      - 'api/tests/ministeroPaginationSafety.test.js'
      - 'api/tests/civicMinisteroScheduler.test.js'
      - '.github/workflows/civic-ministero-sync.yml'
      - 'api/scripts/sync_eci.py'
      - 'api/tests/civicNewInitiativeNotificationPreparation.test.js'
      - 'api/routes/notifiche.js'
      - 'client/src/pages/NotifichePreferenze.tsx'
      - 'client/src/pages/ECI/index.tsx'
      - 'client/src/pages/IniziativePopolari/index.tsx'
      - 'client/src/pages/ReferendumAbrogativi/index.tsx'
      - 'client/src/pages/ReferendumAbrogativi/types/index.ts'
      - '.github/workflows/eci_sync.yml'
      - '.github/workflows/civic-new-initiative-notifications.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static syntax and isolated Node contracts
        run: |
          node --check api/services/civicNewInitiativeEventCollector.js
          node --check api/services/civicPushTopics.js
          node --check api/services/civicPushTopicBootstrap.js
          node --check api/services/civicPushRollback.js
          node --check api/services/civicPushRecovery.js
          node --check api/services/civicRuntimeDatabaseIdentity.js
          node --check api/scripts/civicPushEmergencyStop.js
          node --check api/scripts/prepareCivicPushRecovery.js
          node --check api/scripts/reconcileCivicPushTopics.js
          node --check api/services/civicPushDeliveryGuard.js
          node --check api/services/civicSessionLockSafety.js
          node --check api/services/civicSessionAffinityProbe.js
          node --check api/scripts/checkCivicSessionAffinity.js
          node --check api/routes/user/delete-account.js
          node --check api/services/civicNewInitiativePushDispatcher.js
          node --check api/routes/civicPushDispatch.js
          node --check api/routes/fcm-tokens.js
          node --check api/jobs/ministeroSyncJob.js
          node --check api/services/ministeroSync.js
          node --check api/services/ministeroPaginationSafety.js
          node --check api/routes/notifiche.js
          node --test api/tests/civicNewInitiativeNotificationPreparation.test.js api/tests/civicNewInitiativeNotificationDelivery.test.js api/tests/civicPushTopicBootstrap.test.js api/tests/civicPushRollback.test.js api/tests/civicPushRecovery.test.js api/tests/ministeroPaginationSafety.test.js api/tests/civicMinisteroScheduler.test.js api/tests/civicRuntimeDatabaseIdentity.test.js api/tests/civicSessionLockSafety.test.js api/tests/civicSessionAffinityProbe.test.js
      - name: Python ECI source tests (no real API, DB or push)
        run: |
          python -m pip install requests
          python -m unittest api.tests.test_sync_eci api.tests.test_civic_test_database_safety
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: civic_ci_only
          POSTGRES_DB: civic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVIC_TEST_DATABASE_URL: postgresql://postgres:civic_ci_only@127.0.0.1:5432/civic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL driver
        run: python -m pip install psycopg2-binary
      - name: PostgreSQL 16 migration, RLS and idempotency
        run: python -m unittest api.tests.test_civic_migration_postgres -v
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --prefix client --no-audit --no-fund
      - name: Compile DEMOS frontend without deployment
        run: npm run build --prefix client
