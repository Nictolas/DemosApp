jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated API dependencies for HTTP regression
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Static syntax and isolated Node contracts
        run: |
          node --check api/services/civicNewInitiativeEventCollector.js
          node --check api/services/civicPushTopics.js
          node --check api/services/civicPushTopicBootstrap.js
          node --check api/services/civicPushRollback.js
          node --check api/services/civicPushRecovery.js
          node --check api/services/civicRuntimeDatabaseIdentity.js
          node --check api/scripts/civicPushEmergencyStop.js
          node --check api/scripts/prepareCivicPushRecovery.js
          node --check api/scripts/reconcileCivicPushTopics.js
          node --check api/services/civicPushDeliveryGuard.js
          node --check api/tests/civicPushDeliveryGuard.test.js
          node --check api/services/civicSessionLockSafety.js
          node --check api/services/civicSessionAffinityProbe.js
          node --check api/scripts/checkCivicSessionAffinity.js
          node --check api/services/civicStagingSessionEndpointSafety.js
          node --check api/scripts/checkCivicStagingSessionOnRender.js
          node --check api/routes/user/delete-account.js
          node --check api/services/civicNewInitiativePushDispatcher.js
          node --check api/routes/civicPushDispatch.js
          node --check api/routes/fcm-tokens.js
          node --check api/services/civicLegacyFcmStorage.js
          node --check api/tests/civicLegacyFcmStorage.test.js
          node --check api/tests/civicFcmTokenMutation.http.test.js
          node --check api/jobs/ministeroSyncJob.js
          node --check api/services/ministeroSync.js
          node --check api/services/ministeroPaginationSafety.js
          node --check api/routes/notifiche.js
          node --check api/tests/civicPreferencesReadOnly.http.test.js
          node --check api/tests/civicPreferenceGuardRecovery.http.test.js
          node --check api/tests/civicRecipientIsolation.http.test.js
          node --check api/services/notificationSchemaCache.js
          node --check api/tests/notificationSchemaCache.test.js
          node --check api/tests/notificationFeedSchemaPerf.http.test.js
          node --check api/tests/notificationBadgePrivacy.contract.test.js
          node --check api/tests/notificationAdminReportPrivacy.http.test.js
          node --check api/routes/segnalazioni.js
          node --test --test-concurrency=1 api/tests/civicNewInitiativeNotificationPreparation.test.js api/tests/civicNewInitiativeNotificationDelivery.test.js api/tests/civicPushTopicBootstrap.test.js api/tests/civicPushRollback.test.js api/tests/civicPushRecovery.test.js api/tests/civicPushDeliveryGuard.test.js api/tests/ministeroPaginationSafety.test.js api/tests/civicMinisteroScheduler.test.js api/tests/civicRuntimeDatabaseIdentity.test.js api/tests/civicSessionLockSafety.test.js api/tests/civicSessionAffinityProbe.test.js api/tests/civicStagingSessionOnRender.test.js api/tests/civicRenderBootProbe.test.js api/tests/civicRenderDirectDnsProbe.test.js api/tests/civicPreferencesReadOnly.http.test.js api/tests/civicPreferenceGuardRecovery.http.test.js api/tests/civicFcmTokenMutation.http.test.js api/tests/civicLegacyFcmStorage.test.js api/tests/notificationSchemaCache.test.js api/tests/notificationFeedSchemaPerf.http.test.js api/tests/notificationBadgePrivacy.contract.test.js api/tests/notificationAdminReportPrivacy.http.test.js
      - name: Archived ECI deep link and native route HTTP contracts (mock DB)
        run: node --test api/tests/civicEciDeepLinkArchive.http.test.js api/tests/civicNotificationDeepLinkContract.test.js
      - name: Isolated unified-staging preflight/canary safety contracts, no cloud
        run: node --test api/tests/unifiedStagingAppSafety.test.js api/tests/unifiedStagingCivicReadOnlyCanary.test.js api/tests/unifiedStagingPreflightServer.test.js
      - name: Verify private recipients independently without Node runner IPC
        run: node api/tests/civicRecipientIsolation.http.test.js
      - name: Python ECI source tests (no real API, DB or push)
        run: |
          python -m pip install requests
          python -m unittest api.tests.test_sync_eci api.tests.test_civic_test_database_safety
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: civic_ci_only
          POSTGRES_DB: civic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVIC_TEST_DATABASE_URL: postgresql://postgres:civic_ci_only@127.0.0.1:5432/civic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL driver
        run: python -m pip install psycopg2-binary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Node PostgreSQL client for isolated probe
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL 16 migration, RLS and idempotency
        run: |
          python -m unittest api.tests.test_civic_staging_fixture_postgres -v
          python -m unittest api.tests.test_civic_staging_existing_devices_postgres -v
          python -m unittest api.tests.test_civic_staging_runtime_access_postgres -v
          python -m unittest api.tests.test_civic_migration_postgres -v
      - name: ECI overlapping syncs on two real ephemeral PostgreSQL connections
        run: python -m unittest api.tests.test_eci_sync_postgres -v
      - name: Two real PostgreSQL socket observations, never a session approval
        run: node --test api/tests/civicSessionAffinityPostgres.integration.test.js
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --prefix client --no-audit --no-fund
      - name: Civic official-source links and shared expandable detail contracts
        run: node --experimental-strip-types --test client/tests/civicOfficialSources.test.mjs
      - name: Validate disabled-by-default ECI scheduled workflow
        run: node --test api/tests/civicEciSchedulerGate.test.js
      - name: Compile DEMOS frontend without deployment
        run: npm run build --prefix client
