name: Civic new initiative notifications (draft)
on:
  pull_request:
    paths:
      - 'api/database/20261101_civic_new_initiative_notifications.sql'
      - 'api/services/civicNewInitiativeEventCollector.js'
      - 'api/services/civicPushTopics.js'
      - 'api/services/civicPushDeliveryGuard.js'
      - 'api/services/civicNewInitiativePushDispatcher.js'
      - 'api/routes/civicPushDispatch.js'
      - 'api/routes/fcm-tokens.js'
      - 'api/routes/user/delete-account.js'
      - 'api/services/privacyErasureLedgerService.js'
      - 'api/app.js'
      - 'client/src/hooks/use-auth.tsx'
      - 'client/public/firebase-messaging-sw.js'
      - 'api/tests/civicNewInitiativeNotificationDelivery.test.js'
      - 'api/tests/test_civic_migration_postgres.py'
      - 'api/jobs/ministeroSyncJob.js'
      - 'api/scripts/sync_eci.py'
      - 'api/tests/civicNewInitiativeNotificationPreparation.test.js'
      - 'api/routes/notifiche.js'
      - 'client/src/pages/NotifichePreferenze.tsx'
      - 'client/src/pages/ECI/index.tsx'
      - 'client/src/pages/IniziativePopolari/index.tsx'
      - 'client/src/pages/ReferendumAbrogativi/index.tsx'
      - 'client/src/pages/ReferendumAbrogativi/types/index.ts'
      - '.github/workflows/eci_sync.yml'
      - '.github/workflows/civic-new-initiative-notifications.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static syntax and isolated Node contracts
        run: |
          node --check api/services/civicNewInitiativeEventCollector.js
          node --check api/services/civicPushTopics.js
          node --check api/services/civicPushDeliveryGuard.js
          node --check api/routes/user/delete-account.js
          node --check api/services/civicNewInitiativePushDispatcher.js
          node --check api/routes/civicPushDispatch.js
          node --check api/routes/fcm-tokens.js
          node --check api/jobs/ministeroSyncJob.js
          node --check api/routes/notifiche.js
          node --test api/tests/civicNewInitiativeNotificationPreparation.test.js api/tests/civicNewInitiativeNotificationDelivery.test.js
      - name: Python ECI source tests (no real API, DB or push)
        run: |
          python -m pip install requests
          python -m unittest api.tests.test_sync_eci
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: civic_ci_only
          POSTGRES_DB: civic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVIC_TEST_DATABASE_URL: postgresql://postgres:civic_ci_only@127.0.0.1:5432/civic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL driver
        run: python -m pip install psycopg2-binary
      - name: PostgreSQL 16 migration, RLS and idempotency
        run: python -m unittest api.tests.test_civic_migration_postgres -v
