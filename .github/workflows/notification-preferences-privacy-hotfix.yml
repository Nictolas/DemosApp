name: Notification preferences privacy hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/routes/notifiche.js'
      - 'api/tests/notificationPreferencesPrivacyHotfix.http.test.js'
      - '.github/workflows/notification-preferences-privacy-hotfix.yml'

permissions:
  contents: read

jobs:
  test-preference-redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked API dependencies, no scripts
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Parse notification route
        run: node --check api/routes/notifiche.js
      - name: HTTP security regression (fake accounts and DB)
        run: node --test api/tests/notificationPreferencesPrivacyHotfix.http.test.js
