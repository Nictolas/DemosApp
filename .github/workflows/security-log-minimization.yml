name: Security middleware log minimization
on:
  pull_request:
    paths:
      - 'api/middleware/security.js'
      - 'api/tests/securityLogMinimization.synthetic.test.js'
      - 'api/tests/securityRequestOrder.synthetic.test.js'
      - '.github/workflows/security-log-minimization.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: api
      - run: node --test tests/securityLogMinimization.synthetic.test.js tests/securityProductionHardening.test.js tests/securityRequestOrder.synthetic.test.js
        working-directory: api
