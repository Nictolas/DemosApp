name: Utenti canonical sex column regression

on:
  pull_request:
    paths:
      - 'client/src/pages/Utenti/**'
      - 'client/src/components/profile/PersonalDataSection.tsx'
      - 'api/routes/users/search.js'
      - 'api/routes/users/profile.js'
      - 'api/tests/utentiCanonicalSexTable.smoke.test.js'
      - '.github/workflows/utenti-cie-sex-table.yml'

permissions:
  contents: read

jobs:
  utenti-cie-sex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical sex contract and no legacy edits
        run: |
          node --test api/tests/utentiCanonicalSexTable.smoke.test.js
          node --check api/routes/users/search.js
          node --check api/routes/users/profile.js
      - name: Install frontend dependencies
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build --prefix client
