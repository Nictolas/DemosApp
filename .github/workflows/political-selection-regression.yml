name: IMP-046 political selection regression

on:
  push:
    branches: [fix/imp-046-expired-political-selections]
  pull_request:
    paths:
      - 'api/services/politicalSelectionService.js'
      - 'api/routes/candidati.js'
      - 'api/routes/rappresentanti.js'
      - 'api/tests/politicalSelection*.test.js'
      - 'api/tests/politicalSelection*.smoke.test.js'
      - 'api/migrations/20261018_imp046_invalidate_political_selections.sql'
      - '.github/workflows/political-selection-regression.yml'

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imp046
          POSTGRES_PASSWORD: imp046_test_only
          POSTGRES_DB: imp046
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imp046 -d imp046"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: api
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check api/services/politicalSelectionService.js
          node --check api/routes/rappresentanti.js
          node --check api/routes/candidati.js
      - name: Selection and capability regression suite
        run: |
          node --test \
            api/tests/politicalSelectionExpiry.test.js \
            api/tests/politicalSelectionService.test.js \
            api/tests/politicalSelectionWiring.smoke.test.js \
            api/tests/politicalEligibilityService.test.js \
            api/tests/politicalLifecycleService.test.js

      - name: PostgreSQL trigger isolation smoke
        env:
          PGPASSWORD: imp046_test_only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U imp046 -d imp046 -v ON_ERROR_STOP=1 -f api/tests/sql/imp046-invalidation-smoke.sql
