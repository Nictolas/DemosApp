name: Temporary axios lockfile update

on:
  push:
    branches:
      - fix-axios-security

permissions:
  contents: write

jobs:
  update-axios:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update root axios metadata
        run: npm install axios@1.20.0 --save --package-lock-only --ignore-scripts

      - name: Update API axios metadata
        working-directory: api
        run: npm install axios@1.20.0 --save --package-lock-only --ignore-scripts

      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json api/package.json api/package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit"
          else
            git commit -m "Aggiorna axios alla versione 1.20.0"
            git push origin HEAD:fix-axios-security
          fi
