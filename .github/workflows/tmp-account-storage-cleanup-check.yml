name: Temporary account storage cleanup check

on:
  push:
    branches:
      - cleanup-passkey-frontend-account-id

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install client dependencies
        working-directory: client
        run: npm install
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Verify account ID migration and Passkey wording cleanup
        run: |
          grep -q 'ACCOUNT_ID_KEY = "demos_account_id"' client/src/lib/account-storage.ts
          grep -q 'LEGACY_ACCOUNT_ID_KEY = "webauthn_user_id"' client/src/lib/account-storage.ts
          grep -q 'storeAccountId(data.user.id)' client/src/lib/oauth.ts
          grep -q 'storeAccountId(data.user.id)' client/src/pages/registrazione-crea-passkey.tsx
          grep -q 'migrateLegacyAccountId();' client/src/hooks/useAuthLogin.ts
          if grep -q 'Accedi con passkey' client/src/lib/oauth.ts; then
            echo "Messaggio Passkey obsoleto ancora presente in oauth.ts"
            exit 1
          fi
          echo "Account ID cleanup OK"
