name: Parliament Free AI Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/services/parliamentFreeAiPolicy.js'
      - 'api/services/parliamentGroundedAnalysis.js'
      - 'api/services/parliamentFreeGroqBudget.js'
      - 'api/services/groqFreeSmokeService.js'
      - 'api/services/parliamentAiSingleflight.js'
      - 'api/services/parliamentActIdentifier.js'
      - 'api/services/aiExplanationService.js'
      - 'api/services/leggeAnalysisService.js'
      - 'api/routes/voti-camera.js'
      - 'api/routes/voti-parlamento-europeo.js'
      - 'client/src/pages/VotiParlamentoEuropeo.tsx'
      - 'api/tests/parliamentFreeAiPolicy.test.js'
      - 'api/tests/parliamentGroundedAnalysis.test.js'
      - 'api/tests/parliamentFreeGroqBudget.test.js'
      - 'api/tests/groqFreeSmokeService.test.js'
      - 'api/tests/parliamentEuropeanAiAuthorization.test.js'
      - 'api/tests/parliamentLeggeCompletionSafety.test.js'
      - 'api/tests/parliamentAiSingleflight.test.js'
      - 'api/tests/parliamentActIdentifier.test.js'
      - '.github/workflows/parliament-free-ai-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check without API keys
        run: |
          node --check api/services/parliamentFreeAiPolicy.js
          node --check api/services/parliamentGroundedAnalysis.js
          node --check api/services/parliamentFreeGroqBudget.js
          node --check api/services/groqFreeSmokeService.js
          node --check api/services/parliamentAiSingleflight.js
          node --check api/services/parliamentActIdentifier.js
          node --check api/services/aiExplanationService.js
          node --check api/services/leggeAnalysisService.js
          node --check api/routes/voti-camera.js
          node --check api/routes/voti-parlamento-europeo.js
      - name: Free-only provider regression
        run: node --test api/tests/parliamentFreeAiPolicy.test.js api/tests/parliamentGroundedAnalysis.test.js api/tests/parliamentFreeGroqBudget.test.js api/tests/groqFreeSmokeService.test.js api/tests/parliamentEuropeanAiAuthorization.test.js api/tests/parliamentLeggeCompletionSafety.test.js api/tests/parliamentAiSingleflight.test.js api/tests/parliamentActIdentifier.test.js
