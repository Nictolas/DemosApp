<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Menu Responsive - DEMOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #f0f4ff, #b3c6ff);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Simulazione della navbar fissa */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px; /* h-24 + padding */
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 -1px 8px 0 rgba(0,0,0,0.03);
        }
        
        .navbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: #6b7280;
            text-decoration: none;
        }
        
        .navbar-item.active {
            color: #2563eb;
            font-weight: 600;
        }
        
        .navbar-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
        }
        
        .navbar-text {
            font-size: 12px;
        }
        
        /* Layout della pagina menu */
        .menu-page {
            min-height: calc(100vh - 120px);
            max-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            padding-bottom: 120px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 120px; /* Spazio per la navbar */
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .card-content {
            padding: 16px;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            min-height: 0;
        }
        
        .buttons-container {
            margin-top: 16px;
        }
        
        .card-header {
            text-align: center;
            padding: 24px 24px 16px;
            flex-shrink: 0;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .card-description {
            color: #6b7280;
            font-size: 14px;
        }
        
        /* NUOVO: Pulsanti con altezze relative */
        .menu-button {
            height: calc((100vh - 7.5rem - 200px) / 2) !important;
            min-height: 120px !important;
            max-height: 200px !important;
            position: relative;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            border: none;
            background: transparent;
        }
        
        .menu-button:hover {
            transform: scale(0.95);
        }
        
        .menu-button:active {
            transform: scale(0.95);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .button-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .button-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: white;
        }
        
        .button-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }
        
        .button-label {
            font-size: 1.875rem;
            font-weight: 600;
            user-select: none;
        }
        
        /* Ottimizzazioni per schermi molto piccoli */
        @media screen and (max-height: 600px) {
            .menu-button {
                height: calc((100vh - 7.5rem - 150px) / 2) !important;
                min-height: 100px !important;
                max-height: 150px !important;
            }
        }
        
        /* Ottimizzazioni per schermi estremamente piccoli */
        @media screen and (max-height: 500px) {
            .menu-button {
                height: calc((100vh - 7.5rem - 120px) / 2) !important;
                min-height: 80px !important;
                max-height: 120px !important;
            }
            
            .menu-button .button-label {
                font-size: 1.5rem !important;
            }
            
            .menu-button .button-icon {
                font-size: 2rem !important;
                margin-bottom: 0.5rem !important;
            }
        }
        
        /* Info di debug */
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 10000;
            font-family: monospace;
        }
        
        .test-controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 10000;
        }
        
        .test-controls button {
            margin: 2px;
            padding: 5px 10px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 3px;
        }
        
        .test-controls button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="debug-info" id="debugInfo">
        <div>Viewport: <span id="viewport"></span></div>
        <div>Available Height: <span id="availableHeight"></span></div>
        <div>Button Height: <span id="buttonHeight"></span></div>
        <div>Min Height: <span id="minHeight"></span></div>
        <div>Max Height: <span id="maxHeight"></span></div>
    </div>
    
    <div class="test-controls">
        <button onclick="simulateHeight(400)">400px</button>
        <button onclick="simulateHeight(500)">500px</button>
        <button onclick="simulateHeight(600)">600px</button>
        <button onclick="simulateHeight(700)">700px</button>
        <button onclick="simulateHeight(800)">800px</button>
        <button onclick="resetHeight()">Reset</button>
    </div>
    
    <div class="menu-page">
        <div class="container">
            <div class="card">
                <div class="card-header">
                    <div class="logo">D</div>
                    <h1 class="card-title">Menu Principale</h1>
                    <p class="card-description">Test layout responsive con altezze relative</p>
                </div>
            </div>
            <div class="buttons-container">
                <div class="card-content">
                    <button class="menu-button elezioni">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">📊</div>
                            <div class="button-label">Elezioni</div>
                        </div>
                    </button>
                    <button class="menu-button eventi">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">📢</div>
                            <div class="button-label">Eventi</div>
                        </div>
                    </button>
                    <button class="menu-button proponi">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">📄</div>
                            <div class="button-label">Proponi</div>
                        </div>
                    </button>
                    <button class="menu-button vota">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">🗳️</div>
                            <div class="button-label">Vota</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Navbar simulata -->
    <div class="navbar">
        <a href="#" class="navbar-item active">
            <div class="navbar-icon">🏠</div>
            <div class="navbar-text">Home</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">📊</div>
            <div class="navbar-text">Elezioni</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">👤</div>
            <div class="navbar-text">Profilo</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">⚙️</div>
            <div class="navbar-text">Impostazioni</div>
        </a>
    </div>
    
    <script>
        function updateDebugInfo() {
            const vh = window.innerHeight;
            const availableHeight = vh - 120; // Sottrae la navbar
            const buttonHeight = (availableHeight - 200) / 2; // Calcolo dell'altezza del pulsante
            
            document.getElementById('viewport').textContent = `${window.innerWidth}x${vh}px`;
            document.getElementById('availableHeight').textContent = `${availableHeight}px`;
            document.getElementById('buttonHeight').textContent = `${Math.round(buttonHeight)}px`;
            document.getElementById('minHeight').textContent = '120px';
            document.getElementById('maxHeight').textContent = '200px';
        }
        
        function simulateHeight(height) {
            document.body.style.height = height + 'px';
            document.documentElement.style.height = height + 'px';
            updateDebugInfo();
        }
        
        function resetHeight() {
            document.body.style.height = '';
            document.documentElement.style.height = '';
            updateDebugInfo();
        }
        
        // Aggiorna le info di debug al caricamento e al resize
        window.addEventListener('load', updateDebugInfo);
        window.addEventListener('resize', updateDebugInfo);
        
        // Aggiorna periodicamente per mostrare i valori in tempo reale
        setInterval(updateDebugInfo, 1000);
    </script>
</body>
</html>
