services:
  # Backend API (deploy manuale proposto; attivare prima OFF nel dashboard Render)
  - type: web
    name: demos-backend
    env: node
    rootDir: api
    buildCommand: npm ci
    startCommand: node index.js
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_OMIT
        value: dev
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://www.demos.community
    customDomains:
      - name: api.demos.community

  # Frontend (deploy manuale proposto; attivare prima OFF nel dashboard Render)
  - type: web
    name: demos-frontend
    env: static
    buildCommand: cd client && npm ci --only=production && npm run build
    staticPublishPath: client/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://api.demos.community
      # Firebase Configuration - IMPORTANTE: Queste variabili devono essere presenti durante il build
      - key: VITE_FIREBASE_API_KEY
        sync: false  # Deve essere configurata manualmente su Render.com
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false  # CRITICO: Deve essere configurata su Render.com
    customDomains:
      - name: www.demos.community
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /firebase-messaging-sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /*
        name: X-Frame-Options
        value: DENY
