services:
  # Backend API (con auto-deploy)
  - type: web
    name: demos-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://www.demos.community
    customDomains:
      - name: api.demos.community

  # Frontend (con auto-deploy)
  - type: web
    name: demos-frontend
    env: static
    buildCommand: cd client && npm ci --only=production && npm run build
    staticPublishPath: client/dist
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://api.demos.community
    customDomains:
      - name: www.demos.community
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
