<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Layout Menu - DEMOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #f0f4ff, #b3c6ff);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Simulazione della navbar fissa */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px; /* h-24 + padding */
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 -1px 8px 0 rgba(0,0,0,0.03);
        }
        
        .navbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: #6b7280;
            text-decoration: none;
        }
        
        .navbar-item.active {
            color: #2563eb;
            font-weight: 600;
        }
        
        .navbar-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
        }
        
        .navbar-text {
            font-size: 12px;
        }
        
        /* Layout della pagina menu */
        .menu-page {
            min-height: calc(100vh - 120px);
            max-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            padding-bottom: 120px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 120px; /* Spazio per la navbar */
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .card-content {
            padding: 16px;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            min-height: 0;
        }
        
        .buttons-container {
            margin-top: 16px;
        }
        
        .card-header {
            text-align: center;
            padding: 24px 24px 16px;
            flex-shrink: 0;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .card-description {
            color: #6b7280;
            font-size: 14px;
        }
        
        .card-content {
            padding: 16px;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            min-height: 0;
        }
        
        .menu-button {
            max-height: calc((100vh - 120px - 200px) / 2);
            height: 192px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        
        .menu-button:hover {
            transform: scale(1.02);
        }
        
        .menu-button:active {
            transform: scale(0.98);
        }
        
        .button-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        .button-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 16px;
        }
        
        .button-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .button-label {
            color: #374151;
            font-weight: 600;
            font-size: 20px;
            text-align: center;
        }
        
        /* Colori per i pulsanti */
        .elezioni { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
        .eventi { background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); }
        .proponi { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); }
        .vota { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); }
        
        /* Media queries per responsive */
        @media (max-width: 640px) {
            .menu-button {
                height: 192px;
            }
        }
        
        @media (min-width: 641px) and (max-width: 768px) {
            .menu-button {
                height: 208px;
            }
        }
        
        @media (min-width: 769px) {
            .menu-button {
                height: 192px;
            }
        }
        
        /* Test per diverse altezze di schermo */
        .test-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="test-info" id="testInfo">
        <div>Viewport: <span id="viewport"></span></div>
        <div>Available: <span id="available"></span></div>
        <div>Button Height: <span id="buttonHeight"></span></div>
    </div>
    
    <div class="menu-page">
        <div class="container">
            <div class="card">
                <div class="card-header">
                    <div class="logo">D</div>
                    <h1 class="card-title">Menu Principale</h1>
                    <p class="card-description">Benvenuto nell'applicazione DEMOS. Seleziona un'opzione per continuare.</p>
                </div>
            </div>
            <div class="buttons-container">
                <div class="card-content">
                    <button class="menu-button elezioni">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">📊</div>
                            <div class="button-label">Elezioni</div>
                        </div>
                    </button>
                    <button class="menu-button eventi">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">📢</div>
                            <div class="button-label">Eventi</div>
                        </div>
                    </button>
                    <button class="menu-button proponi">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">📄</div>
                            <div class="button-label">Proponi</div>
                        </div>
                    </button>
                    <button class="menu-button vota">
                        <div class="button-bg"></div>
                        <div class="button-content">
                            <div class="button-icon">✅</div>
                            <div class="button-label">Vota</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Navbar simulata -->
    <nav class="navbar">
        <a href="#" class="navbar-item active">
            <div class="navbar-icon">🏠</div>
            <div class="navbar-text">Menu</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">💬</div>
            <div class="navbar-text">Opinioni</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">👥</div>
            <div class="navbar-text">Rappresentanti</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">🔔</div>
            <div class="navbar-text">Notifiche</div>
        </a>
        <a href="#" class="navbar-item">
            <div class="navbar-icon">⚙️</div>
            <div class="navbar-text">Impostazioni</div>
        </a>
    </nav>
    
    <script>
        function updateTestInfo() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const available = vh - 120; // 120px per navbar
            const buttonHeight = Math.min(192, (available - 200) / 2); // 200px per header e padding
            
            document.getElementById('viewport').textContent = `${vw}x${vh}`;
            document.getElementById('available').textContent = `${available}px`;
            document.getElementById('buttonHeight').textContent = `${Math.round(buttonHeight)}px`;
        }
        
        window.addEventListener('resize', updateTestInfo);
        updateTestInfo();
    </script>
</body>
</html>
