apply plugin: 'com.android.application'

// Solo test Android: nessun annuncio reale o SDK inizializzato nelle release.
// Per provare su emulatore/dispositivo di sviluppo: -PdemosDebugAppOpenAds=true
// Il publisher ID e le unità di produzione richiedono una PR separata e i gate privacy.
def demosDebugAppOpenAds = (project.findProperty('demosDebugAppOpenAds') ?: 'false').toString() == 'true'
// Allows testing DEMOS's UMP message without embedding its App ID in source.
// The ad unit remains Google's sample unit, and release remains SDK-free.
def demosDebugAdMobAppId = (project.findProperty('demosDebugAdMobAppId') ?: 'ca-app-pub-3940256099942544~3347511713').toString()
if (!(demosDebugAdMobAppId ==~ /ca-app-pub-\d{16}~\d{10}/)) {
    throw new GradleException('Invalid debug-only AdMob application ID format')
}
def demosDebugUmpEea = demosDebugAppOpenAds &&
    (project.findProperty('demosDebugUmpEea') ?: 'false').toString() == 'true'


def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "community.demos"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "community.demos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Forced-EEA QA must never replace an installed DEMOS package.
            if (demosDebugUmpEea) {
                applicationIdSuffix '.qaopen'
            }
            // Test IDs ufficiali Google: in debug soltanto, con opt-in esplicito.
            buildConfigField 'boolean', 'DEMOS_APP_OPEN_ADS_ENABLED', demosDebugAppOpenAds.toString()
            buildConfigField 'String', 'DEMOS_ADMOB_APP_ID', "\"${demosDebugAdMobAppId}\""
            buildConfigField 'boolean', 'DEMOS_UMP_DEBUG_EEA', demosDebugUmpEea.toString()
            manifestPlaceholders['demosAdMobAppId'] = demosDebugAdMobAppId
            buildConfigField 'String', 'DEMOS_APP_OPEN_UNIT_ID', '"ca-app-pub-3940256099942544/9257395921"'
        }
        release {
            // Fail closed: nessuna pubblicità in build distribuite ai tester.
            buildConfigField 'boolean', 'DEMOS_APP_OPEN_ADS_ENABLED', 'false'
            buildConfigField 'String', 'DEMOS_ADMOB_APP_ID', '""'
            buildConfigField 'boolean', 'DEMOS_UMP_DEBUG_EEA', 'false'
            buildConfigField 'String', 'DEMOS_APP_OPEN_UNIT_ID', '""'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // GMA Next-Gen e UMP sono presenti esclusivamente in build DEBUG.
    debugImplementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0'
    debugImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Login Google nativo: Credential Manager restituisce un Google ID token
    // che viene verificato dal backend DEMOS esistente.
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
