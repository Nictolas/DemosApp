services:
  - type: web
    name: demos-frontend
    env: static
    buildCommand: npm ci --only=production && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://api.demos.community
    customDomains:
      - name: www.demos.community
    headers:
      # Do not keep the React HTML shell or SPA routes immutable.
      - path: /*
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
