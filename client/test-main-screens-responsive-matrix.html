<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEMOS Main Screens Matrix</title>
  <style>
    body{margin:0;padding:24px;font:13px/1.45 ui-monospace,monospace;background:#f8fafc;color:#0f172a}
    h1{font:700 22px/1.2 system-ui,sans-serif;margin:0 0 16px}
    #summary{padding:14px 16px;border-radius:10px;background:#e2e8f0;white-space:pre-wrap;max-height:75vh;overflow:auto}
    #summary[data-pass="true"]{background:#d1fae5;color:#065f46}
    #summary[data-pass="false"]{background:#fee2e2;color:#991b1b}
    .audit-frame{position:absolute;left:-12000px;top:0;border:0;visibility:visible}
  </style>
</head>
<body>
  <h1>DEMOS — schermate principali / matrice responsive reale</h1>
  <div id="summary">MATRIX IN ESECUZIONE…</div>
  <div id="frames"></div>
  <script>
    const screens = ['preferiti','opinioni','eventi','menu','impostazioni','profilo'];
    const devices = [
      {name:'small-web-320x568', w:320, h:568, android:false},
      {name:'compact-android-360x640', w:360, h:640, android:true},
      {name:'android-360x800', w:360, h:800, android:true},
      {name:'iphone-web-390x844', w:390, h:844, android:false},
      {name:'large-web-430x932', w:430, h:932, android:false},
      {name:'landscape-android-667x375', w:667, h:375, android:true},
    ];
    const cases = screens.flatMap((screen) => devices.map((device) => ({screen,...device})));
    const host = document.getElementById('frames');
    const summary = document.getElementById('summary');
    const results = [];

    const runCase = (entry) => new Promise((resolve) => {
      const frame = document.createElement('iframe');
      frame.className = 'audit-frame';
      frame.width = String(entry.w);
      frame.height = String(entry.h);
      frame.style.width = `${entry.w}px`;
      frame.style.height = `${entry.h}px`;
      frame.src = `/test-main-screens-responsive.html?screen=${entry.screen}&android=${entry.android ? '1' : '0'}`;
      host.appendChild(frame);
      const started = performance.now();
      const inspect = () => {
        try {
          const doc = frame.contentDocument;
          const result = doc?.body?.dataset?.auditResult;
          const text = doc?.getElementById('audit-status')?.textContent || '';
          if (result === 'PASS' || result === 'FAIL') {
            frame.remove();
            resolve({...entry,pass:result==='PASS',text});
            return;
          }
        } catch (error) {}
        if (performance.now() - started > 12000) {
          frame.remove();
          resolve({...entry,pass:false,text:'AUDIT TIMEOUT'});
          return;
        }
        setTimeout(inspect,100);
      };
      frame.addEventListener('load',() => setTimeout(inspect,120),{once:true});
      setTimeout(inspect,350);
    });

    (async () => {
      for (const entry of cases) {
        const result = await runCase(entry);
        results.push(result);
        const failed = results.filter((r) => !r.pass);
        summary.textContent = `RUNNING ${results.length}/${cases.length} | ${failed.length} fail\n` + results.map((r)=>`${r.pass?'PASS':'FAIL'} | ${r.screen} | ${r.name} | ${r.text}`).join('\n');
      }
      const failed = results.filter((r) => !r.pass);
      summary.dataset.pass = String(failed.length === 0);
      summary.textContent = `${failed.length ? 'MATRIX FAIL' : 'MATRIX PASS'} | ${results.length - failed.length}/${results.length} PASS\n` + results.map((r)=>`${r.pass?'PASS':'FAIL'} | ${r.screen} | ${r.name} | ${r.text}`).join('\n');
      document.body.dataset.auditResult = failed.length ? 'FAIL' : 'PASS';
      document.body.dataset.auditFailures = String(failed.length);
      document.title = `${failed.length ? 'MATRIX FAIL' : 'MATRIX PASS'} — ${results.length - failed.length}/${results.length}`;
    })();
  </script>
</body>
</html>
